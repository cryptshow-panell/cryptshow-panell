    }

    var pendents = state.tasques.filter(function (t) { return !t.fet; });
    var fetes = state.tasques.filter(function (t) { return t.fet; });
    var buida = state.tasques.length === 0 ? '<p class="csx-empty">Encara no hi ha cap tasca.</p>' : "";
    function fila(t, marcat) {
      var ds = (!marcat && t.data) ? '<span class="csx-task-date">' + escapeHtml(t.data) + '</span>' : "";
      return '<li><label><input type="checkbox" ' + (marcat ? "checked" : "") + ' data-toggle="' + t.id + '">' +
        '<span>' + escapeHtml(t.text) + '</span></label>' + ds +
        '<button class="csx-link-btn" data-del-tasca="' + t.id + '">eliminar</button></li>';
    }
    return '<section class="csx-panel">' + subnav +
      '<div class="csx-panel-head"><div><div class="csx-eyebrow">Pendents</div><h2>Tasques</h2></div></div>' +
      '<div class="csx-form-row">' +
      '<input id="t-text" class="csx-grow" placeholder="Descriu la tasca" value="' + escapeHtml(tasquesForm.text) + '">' +
      '<input id="t-data" style="width:160px" placeholder="Data límit" value="' + escapeHtml(tasquesForm.data) + '">' +
      '<button class="csx-btn" id="t-afegir">Afegir</button></div>' + buida +
      (pendents.length > 0 ? '<ul class="csx-task-list">' + pendents.map(function (t) { return fila(t, false); }).join("") + '</ul>' : "") +
      (fetes.length > 0 ? '<div class="csx-eyebrow" style="margin-top:22px;">Fetes</div>' +
        '<ul class="csx-task-list csx-task-list-done">' + fetes.map(function (t) { return fila(t, true); }).join("") + '</ul>' : "") +
      '</section>';
  }

  function tarifesHtml() {
    var edicions = state.edicions[state.cicleActiu] || [];
    var edicioId = state.tarifesEdicio;
    if (!edicioId && edicions.length > 0) {
      var ultima = edicions.slice().sort(function (a, b) { return (b.any || 0) - (a.any || 0); })[0];
      edicioId = ultima.id; state.tarifesEdicio = edicioId;
    }
    var edicio = edicions.filter(function (e) { return e.id === edicioId; })[0];

    var selectEdicio = '<select id="tarifes-edicio">' +
      (edicions.length === 0 ? '<option value="">(cap edició)</option>' : "") +
      edicions.slice().sort(function (a, b) { return (b.any || 0) - (a.any || 0); }).map(function (e) {
        var lbl = e.nom ? e.nom + " (" + e.any + ")" : "Edició " + e.any;
        return '<option value="' + e.id + '"' + (e.id === edicioId ? " selected" : "") + '>' + escapeHtml(lbl) + '</option>';
      }).join("") + '</select>';

    if (!edicio) {
      return '<div class="csx-panel-head"><div><div class="csx-eyebrow">Tarifes</div>' +
        '<h2>Selecciona una edició</h2></div><div>' + selectEdicio + '</div></div>' +
        '<p class="csx-empty">Encara no hi ha cap edició creada. Ves a <button class="csx-link-btn" data-nav="edicions">Edicions</button> per crear-ne una.</p>';
    }

    var tarifes = tarifesEdicio(edicio.id);

    var opcionsNoms = NOMS_TARIFES.map(function (nom) {
      return '<option value="' + escapeHtml(nom) + '">' + escapeHtml(nom) + '</option>';
    }).join("");

    var formAfegir = '<div class="csx-form-row" style="margin-bottom:20px;align-items:center;">' +
      '<select id="tarifa-nom-select" style="min-width:220px;">' + opcionsNoms + '</select>' +
      '<input id="tarifa-nom-altres" type="text" placeholder="Nom personalitzat" style="width:220px;display:none;">' +
      '<input id="tarifa-preu-nova" type="text" placeholder="Preu (ex: 5€)" style="width:180px;">' +
      '<button class="csx-btn" id="tarifa-afegir">+ Afegir tarifa</button>' +
      '</div>';

    var files = tarifes.map(function (t) {
      return '<tr data-tarifa-id="' + t.id + '">' +
        '<td class="nom-tarifa">' + escapeHtml(t.nom || "") + '</td>' +
        '<td><input type="text" data-tarifa-preu="' + t.id + '" value="' + escapeHtml(t.preu || "") + '" placeholder="—"></td>' +
        '<td><button class="csx-link-btn" data-del-tarifa="' + t.id + '">eliminar</button></td>' +
        '</tr>';
    }).join("");

    var buida = tarifes.length === 0
      ? '<tr><td colspan="3" style="color:var(--text-dim);font-style:italic;padding:14px 10px;">Encara no hi ha cap tarifa en aquesta edició.</td></tr>'
      : "";

    return '<div class="csx-panel-head"><div><div class="csx-eyebrow">Tarifes del festival</div>' +
      '<h2>Preus de les sessions</h2></div><div>' + selectEdicio + '</div></div>' +
      '<p style="font-size:12px;color:var(--text-dim);margin:-8px 0 16px;">' +
      'Aquestes tarifes apareixen al desplegable de cada sessió o activitat al crear-la o editar-la.</p>' +
      formAfegir +
      '<table class="csx-taula-tarifes">' +
      '<thead><tr><th>Nom</th><th>Preu</th><th></th></tr></thead>' +
      '<tbody>' + files + buida + '</tbody>' +
      '</table>';
  }

  // ===================== ATTACH HANDLERS =====================
  function attachHandlers() {
    var main = document.getElementById("csx-main");
    if (!main) return;

    main.querySelectorAll("[data-nav]").forEach(function (el) {
      el.addEventListener("click", function () {
        var dest = el.getAttribute("data-nav");
        if (!teAcces(dest)) { window.alert("No tens accés a aquesta secció."); return; }
        state.tab = dest;
        render();
      });
    });

    // ---- USUARIS ----
    if (state.tab === "usuaris") {
      var btnCrear = document.getElementById("user-crear");
      if (btnCrear) btnCrear.addEventListener("click", function () {
        state.modal = { tipus: "crearUsuari" };
        render();
      });
      main.querySelectorAll("[data-edit-rol]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var email = btn.getAttribute("data-edit-rol");
          var u = state.usuaris[emailKey(email)];
          if (!u) return;
          state.modal = { tipus: "canviarRol", usuari: { email: email, rols: u.rols || {} } };
          render();
        });
      });
      main.querySelectorAll("[data-del-user]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var email = btn.getAttribute("data-del-user");
          if (!window.confirm("Eliminar l'usuari " + email + "?\n\nAquesta acció no es pot desfer.")) return;
          db.ref("cryptshow/usuaris/" + emailKey(email)).remove().then(function () {
            window.alert("L'usuari ha estat eliminat del sistema.");
            render();
          }).catch(function (err) {
            console.error("Error eliminant usuari", err);
            window.alert("No s'ha pogut eliminar.");
          });
        });
      });
      return;
    }

    if (state.tab === "edicions") {
      main.querySelectorAll("[data-cicle]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.cicleActiu = btn.getAttribute("data-cicle");
          state.premsaEdicio = null; state.subtitolsEdicio = null; state.programacioEdicio = null; state.tarifesEdicio = null;
          state.literariEdicio = null; state.literariActeObert = null;
          render();
        });
      });
      main.querySelectorAll("[data-rename-cicle]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-rename-cicle");
          var nou = window.prompt("Nom del cicle:", cicleLabelPerId(id));
          if (nou === null) return;
          nou = nou.trim(); if (!nou) return;
          state.cicleLabels[id] = nou; desarCicleLabels(); render();
        });
      });
      var anyInput = document.getElementById("e-any");
      var nomInput = document.getElementById("e-nom");
      if (anyInput) anyInput.addEventListener("input", function () { novaEdicioForm.any = anyInput.value; });
      if (nomInput) nomInput.addEventListener("input", function () { novaEdicioForm.nom = nomInput.value; });
      var eCrear = document.getElementById("e-crear");
      if (eCrear) eCrear.addEventListener("click", function () {
        var any = parseInt(novaEdicioForm.any, 10);
        if (isNaN(any)) return;
        var novaEd = { id: uid(), any: any, nom: novaEdicioForm.nom.trim() };
        state.edicions[state.cicleActiu].push(novaEd);
        desarEdicions(state.cicleActiu);
        crearTarifesPerDefecte(novaEd.id);
        novaEdicioForm = { any: String(ANY_ACTUAL), nom: "" };
        render();
      });
      main.querySelectorAll("[data-obrir-edicio]").forEach(function (row) {
        row.addEventListener("click", function () {
          state.edicioOberta = row.getAttribute("data-obrir-edicio");
          state.programacioEdicio = state.edicioOberta;
          state.sessioOberta = null; state.activitatOberta = null; state.descansOberta = null; state.juvenilOberta = null;
          state.programacioVista = "oficial";
          state.tab = "programacio";
          render();
        });
      });
      main.querySelectorAll("[data-renombrar-edicio]").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var id = btn.getAttribute("data-renombrar-edicio");
          var ed = state.edicions[state.cicleActiu].filter(function (x) { return x.id === id; })[0];
          if (!ed) return;
          var nou = window.prompt("Nom de l'edició:", ed.nom || "");
          if (nou === null) return;
          ed.nom = nou.trim(); desarEdicions(state.cicleActiu); render();
        });
      });
      main.querySelectorAll("[data-eliminar-edicio]").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var id = btn.getAttribute("data-eliminar-edicio");
          if (!window.confirm("Eliminar aquesta edició i tot el que conté?")) return;
          state.edicions[state.cicleActiu] = state.edicions[state.cicleActiu].filter(function (ed) { return ed.id !== id; });
          desarEdicions(state.cicleActiu);
          delete state.sessions[state.cicleActiu][id];
          delete state.activitats[id];
          delete state.curts[id];
          delete state.subtitolsMeta[id];
          delete state.tarifes[id];
          delete state.literari[id];
          db.ref("cryptshow/sessions/" + state.cicleActiu + "/" + id).remove();
          db.ref("cryptshow/activitats/" + id).remove();
          db.ref("cryptshow/curts/" + id).remove();
          db.ref("cryptshow/subtitolsMeta/" + id).remove();
          db.ref("cryptshow/preus/" + id).remove();
          db.ref("cryptshow/literari/" + id).remove();
          if (state.edicioOberta === id) state.edicioOberta = null;
          if (state.programacioEdicio === id) state.programacioEdicio = null;
          if (state.premsaEdicio === id) state.premsaEdicio = null;
          if (state.subtitolsEdicio === id) state.subtitolsEdicio = null;
          if (state.tarifesEdicio === id) state.tarifesEdicio = null;
          if (state.literariEdicio === id) state.literariEdicio = null;
          render();
        });
      });
    }

    // ===================== LITERARI =====================
    if (state.tab === "literari") {
      var selLit = document.getElementById("lit-edicio");
      if (selLit) selLit.addEventListener("change", function () {
        state.literariEdicio = selLit.value;
        state.literariActeObert = null;
        state.literariItemForm = null;
        state.literariEditarActe = false;
        state.literariNouActeForm = null;
        render();
      });

      // Crear acte
      var formNouActe = document.getElementById("lit-nom");
      if (formNouActe) {
        var fNom = document.getElementById("lit-nom");
        var fNum = document.getElementById("lit-numEdicio");
        var fDia = document.getElementById("lit-dia");
        var fLloc = document.getElementById("lit-lloc");
        var fEnt = document.getElementById("lit-entrada");
        var fPres = document.getElementById("lit-presentador");
        if (!state.literariNouActeForm) {
          state.literariNouActeForm = { dia: "", nom: "Cryptshow Literari", numEdicio: "", lloc: "", entrada: "Entrada lliure", presentador: "" };
        }
        if (fNom) fNom.addEventListener("input", function () { state.literariNouActeForm.nom = fNom.value; });
        if (fNum) fNum.addEventListener("input", function () { state.literariNouActeForm.numEdicio = fNum.value; });
        if (fDia) fDia.addEventListener("input", function () { state.literariNouActeForm.dia = fDia.value; });
        if (fLloc) fLloc.addEventListener("input", function () { state.literariNouActeForm.lloc = fLloc.value; });
        if (fEnt) fEnt.addEventListener("input", function () { state.literariNouActeForm.entrada = fEnt.value; });
        if (fPres) fPres.addEventListener("input", function () { state.literariNouActeForm.presentador = fPres.value; });
        var btnCrear = document.getElementById("lit-crear-acte");
        if (btnCrear) btnCrear.addEventListener("click", function () {
          var f = state.literariNouActeForm || {};
          if (!f.nom || !f.nom.trim()) { window.alert("Cal un nom per a l'acte."); return; }
          if (!f.dia) { window.alert("Cal un dia per a l'acte."); return; }
          var edId = state.literariEdicio;
          if (!edId) { window.alert("Selecciona una edició."); return; }
          var actId = uid();
          var acte = {
            id: actId,
            dia: f.dia,
            nom: f.nom.trim(),
            numEdicio: (f.numEdicio || "").trim(),
            lloc: (f.lloc || "").trim(),
            entrada: (f.entrada || "").trim(),
            presentador: (f.presentador || "").trim(),
            moderadors: [],
            colaboradors: [],
            items: {}
          };
          db.ref("cryptshow/literari/" + edId + "/" + actId).set(acte);
          state.literariNouActeForm = null;
          state.literariActeObert = actId;
          render();
        });
      }

      // Acte existent
      var acte = literariPerEdicio(state.literariEdicio);
      if (acte) {
        var actId = acte._actId;
        var edId = state.literariEdicio;

        // Eliminar acte
        var btnElimActe = document.getElementById("lit-eliminar-acte");
        if (btnElimActe) btnElimActe.addEventListener("click", function () {
          if (!window.confirm("Eliminar tot l'acte literari d'aquesta edició?")) return;
          eliminarLiterariActe(edId, actId);
          state.literariActeObert = null;
          state.literariItemForm = null;
          state.literariEditarActe = false;
          render();
        });

        // Export
        var btnCSV = document.getElementById("lit-export-csv");
        if (btnCSV) btnCSV.addEventListener("click", function () { exportarLiterariCSV(); });
        var btnPDF = document.getElementById("lit-export-pdf");
        if (btnPDF) btnPDF.addEventListener("click", function () { exportarLiterariPDF(); });

        // Editar metadades de l'acte
        var btnEditarActe = document.getElementById("lit-editar-acte");
        if (btnEditarActe) btnEditarActe.addEventListener("click", function () {
          state.literariEditarActe = true;
          render();
        });
        var btnCancelarEditar = document.getElementById("lit-cancelar-editar-acte");
        if (btnCancelarEditar) btnCancelarEditar.addEventListener("click", function () {
          state.literariEditarActe = false;
          state.literariCampsForm = { moderadors: "", colaboradors: "" };
          render();
        });

        if (state.literariEditarActe) {
          var eNom = document.getElementById("lit-e-nom");
          var eNum = document.getElementById("lit-e-numEdicio");
          var eDia = document.getElementById("lit-e-dia");
          var eLloc = document.getElementById("lit-e-lloc");
          var eEnt = document.getElementById("lit-e-entrada");
          var ePres = document.getElementById("lit-e-presentador");
          if (eNom) eNom.addEventListener("change", function () { desarLiterariActe(edId, actId, { nom: eNom.value }); });
          if (eNum) eNum.addEventListener("change", function () { desarLiterariActe(edId, actId, { numEdicio: eNum.value }); });
          if (eDia) eDia.addEventListener("change", function () { desarLiterariActe(edId, actId, { dia: eDia.value }); });
          if (eLloc) eLloc.addEventListener("change", function () { desarLiterariActe(edId, actId, { lloc: eLloc.value }); });
          if (eEnt) eEnt.addEventListener("change", function () { desarLiterariActe(edId, actId, { entrada: eEnt.value }); });
          if (ePres) ePres.addEventListener("change", function () { desarLiterariActe(edId, actId, { presentador: ePres.value }); });

          // Llistes de textos (moderadors / colaboradors)
          main.querySelectorAll("[data-lit-add-text]").forEach(function (inp) {
            var camp = inp.getAttribute("data-lit-add-text");
            inp.addEventListener("input", function () {
              state.literariCampsForm[camp] = inp.value;
            });
            inp.addEventListener("keydown", function (e) {
              if (e.key === "Enter") {
                e.preventDefault();
                var btn = main.querySelector('[data-lit-add-btn="' + camp + '"]');
                if (btn) btn.click();
              }
            });
          });
          main.querySelectorAll("[data-lit-add-btn]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var camp = btn.getAttribute("data-lit-add-btn");
              var val = (state.literariCampsForm[camp] || "").trim();
              if (!val) return;
              var llista = (acte[camp] || []).slice();
              llista.push(val);
              var canvi = {};
              canvi[camp] = llista;
              desarLiterariActe(edId, actId, canvi);
              state.literariCampsForm[camp] = "";
            });
          });
          main.querySelectorAll("[data-lit-del-text]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var camp = btn.getAttribute("data-lit-del-text");
              var idx = parseInt(btn.getAttribute("data-lit-del-index"), 10);
              var llista = (acte[camp] || []).slice();
              llista.splice(idx, 1);
              var canvi = {};
              canvi[camp] = llista;
              desarLiterariActe(edId, actId, canvi);
            });
          });

          var btnDesar = document.getElementById("lit-desar-acte");
          if (btnDesar) btnDesar.addEventListener("click", function () {
            state.literariEditarActe = false;
            state.literariCampsForm = { moderadors: "", colaboradors: "" };
            render();
          });
        }

        // ---- Item form ----
        var items = acte.items || [];
        var f = state.literariItemForm || null;
        var esEdit = !!(f && f._editId);

        if (!f) {
          state.literariItemForm = {
            horaInici: "", horaFixada: false, durMin: "", tipus: "Xerrada",
            titol: "", convidats: [], obra: "", descripcio: ""
          };
          f = state.literariItemForm;
        }

        var iHora = document.getElementById("lit-i-hora");
        var iFix = document.getElementById("lit-i-fixada");
        var iDur = document.getElementById("lit-i-dur");
        var iTipus = document.getElementById("lit-i-tipus");
        var iTitol = document.getElementById("lit-i-titol");
        var iObra = document.getElementById("lit-i-obra");
        var iDesc = document.getElementById("lit-i-descripcio");
        var iConvInput = document.getElementById("lit-i-convidat-input");
        var btnAddConv = document.getElementById("lit-i-add-convidat");

        if (iHora) iHora.addEventListener("input", function () { f.horaInici = iHora.value; });
        if (iFix) iFix.addEventListener("change", function () {
          f.horaFixada = iFix.checked;
          var lbl = iFix.parentElement;
          if (lbl) lbl.className = "csx-fix-check" + (iFix.checked ? " sel" : "");
        });
        if (iDur) iDur.addEventListener("input", function () { f.durMin = iDur.value; });
        if (iTipus) iTipus.addEventListener("change", function () { f.tipus = iTipus.value; });
        if (iTitol) iTitol.addEventListener("input", function () { f.titol = iTitol.value; });
        if (iObra) iObra.addEventListener("input", function () { f.obra = iObra.value; });
        if (iDesc) iDesc.addEventListener("input", function () { f.descripcio = iDesc.value; });

        if (iConvInput) iConvInput.addEventListener("input", function () {
          state.literariCampsForm.convidats = iConvInput.value;
        });
        if (iConvInput) iConvInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); if (btnAddConv) btnAddConv.click(); }
        });
        if (btnAddConv) btnAddConv.addEventListener("click", function () {
          var val = (state.literariCampsForm.convidats || "").trim();
          if (!val) return;
          f.convidats = (f.convidats || []).slice();
          f.convidats.push(val);
          state.literariCampsForm.convidats = "";
          render();
        });
        main.querySelectorAll("[data-lit-del-convidat]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var idx = parseInt(btn.getAttribute("data-lit-del-convidat"), 10);
            f.convidats = (f.convidats || []).slice();
            f.convidats.splice(idx, 1);
            render();
          });
        });

        var btnDesarItem = document.getElementById("lit-i-desar");
        if (btnDesarItem) btnDesarItem.addEventListener("click", function () {
          var hora = (f.horaInici || "").trim();
          var dur = parseInt(f.durMin, 10);
          var titol = (f.titol || "").trim();
          if (!hora) { window.alert("Cal una hora d'inici."); return; }
          if (!dur || dur < 1) { window.alert("Cal una durada (en minuts). És obligatòria."); return; }
          if (!titol) { window.alert("Cal un títol."); return; }

          if (esEdit) {
            var canvis = {
              horaInici: hora,
              horaFixada: !!f.horaFixada,
              durMin: dur,
              tipus: f.tipus || "Xerrada",
              titol: titol,
              convidats: f.convidats || [],
              obra: (f.obra || "").trim(),
              descripcio: (f.descripcio || "").trim()
            };
            desarLiterariItem(edId, actId, f._editId, canvis);
            state.literariItemForm = null;
            state.literariCampsForm.convidats = "";
          } else {
            // ordre = màxim + 1
            var maxOrdre = -1;
            items.forEach(function (it) {
              var o = (typeof it.ordre === "number") ? it.ordre : 0;
              if (o > maxOrdre) maxOrdre = o;
            });
            var nouItem = {
              id: uid(),
              ordre: maxOrdre + 1,
              horaInici: hora,
              horaFixada: !!f.horaFixada,
              durMin: dur,
              tipus: f.tipus || "Xerrada",
              titol: titol,
              convidats: f.convidats || [],
              obra: (f.obra || "").trim(),
              descripcio: (f.descripcio || "").trim()
            };
            crearLiterariItem(edId, actId, nouItem);
            state.literariItemForm = null;
            state.literariCampsForm.convidats = "";
          }
          render();
        });

        var btnCancelarItem = document.getElementById("lit-i-cancelar");
        if (btnCancelarItem) btnCancelarItem.addEventListener("click", function () {
          state.literariItemForm = null;
          state.literariCampsForm.convidats = "";
          render();
        });

        // ---- Accions sobre items existents ----
        main.querySelectorAll("[data-lit-editar]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var id = btn.getAttribute("data-lit-editar");
            var it = items.filter(function (x) { return x.id === id; })[0];
            if (!it) return;
            state.literariItemForm = {
              _editId: it.id,
              horaInici: it.horaInici || "",
              horaFixada: !!it.horaFixada,
              durMin: it.durMin || "",
              tipus: it.tipus || "Xerrada",
              titol: it.titol || "",
              convidats: (it.convidats || []).slice(),
              obra: it.obra || "",
              descripcio: it.descripcio || ""
            };
            state.literariCampsForm.convidats = "";
            render();
          });

            if (!draggedItemId || draggedItemId === tid) return;

            var listDesti = row.closest("[data-llista-dia]");
            var destiDia = listDesti ? listDesti.getAttribute("data-llista-dia") : null;
            if (!destiDia || destiDia !== draggedItemDia) {
              window.alert("No es pot canviar de dia arrossegant.\n\nPer canviar el dia, obre la fitxa de la sessió/activitat i canvia'l allà.");
              render();
              return;
            }

            var totsDia = sessionsEd.concat(activitatsEd).filter(function (x) {
              return (x.dia || "") === draggedItemDia;
            });
            totsDia.sort(function (a, b) {

            });

            ordreActual.splice(idxOrigen, 1);

            ordreActual.splice(newIdx, 0, draggedItemId);

            var res = recalcularHoresDia(totsDia, ordreActual);
            if (!res.ok) {

              render();
              return;
            }
            totsDia.forEach(function (it) {

              }
            });

            state.activitats[edicio.id] = activitatsEd;
            desarSessions(state.cicleActiu, edicio.id);

  function eliminarItemPerId(id, edicioId) {
    var sessionsEd = sessionsPerCicle(state.cicleActiu, edicioId);
    var idxS = -1;
    for (var i = 0; i < sessionsEd.length; i++) { if (sessionsEd[i].id === id) { idxS = i; break; } }
    if (idxS >= 0) {
      if (!window.confirm("Eliminar aquesta sessió?")) return;
      state.sessions[state.cicleActiu][edicioId] = sessionsEd.filter(function (s) { return s.id !== id; });
      desarSessions(state.cicleActiu, edicioId); render();
      return;
    }
    var activitatsEd = activitatsEdicio(edicioId);
    var idxA = -1;
    for (var j = 0; j < activitatsEd.length; j++) { if (activitatsEd[j].id === id) { idxA = j; break; } }
    if (idxA >= 0) {
      if (!window.confirm("Eliminar aquest element?")) return;
      state.activitats[edicioId] = activitatsEd.filter(function (a) { return a.id !== id; });
      desarActivitats(edicioId); render();
      return;
    }
  }

  function processarCSV(file, seccio) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      var rows = parseCSV(String(e.target.result));
      if (rows.length < 1) { window.alert("Fitxer buit."); return; }
      var fc = detectarFilaCapsalera(rows);
      state.csvImport = {
        seccioDesti: seccio, allRows: rows, headerRowIndex: fc,
        headers: rows[fc], rows: rows.slice(fc + 1),
        mapping: autoMapejarColumnes(rows[fc]),
        deteccioAutomatica: true
      };
      render();
    };
    reader.onerror = function () { window.alert("No s'ha pogut llegir."); };
    reader.readAsText(file, "UTF-8");
  }

  // ---- EXPORTACIONS EXISTENTS ----
    function construirFilesPremsaExport() {
    var edicions = state.edicions[state.cicleActiu] || [];
    var edicio = edicions.filter(function (e) { return e.id === state.premsaEdicio; })[0];
    if (!edicio) return null;

    var sessionsArr = sessionsPerCicle(state.cicleActiu, edicio.id);
    var programats = {};
    sessionsArr.forEach(function (s) {
      (s.curts || []).forEach(function (c) {
        var k1 = c.catalogId ? ("id:" + c.catalogId) : null;
        var k2 = "titol:" + normalitzarTitol(c.titol);
        var info = { dia: s.dia || "", horaInici: s.horaInici || "", horaFi: horaFiSessio(s), lloc: s.lloc || "", nomSessio: s.nom || "" };
        if (k1) programats[k1] = info;
        if (!programats[k2]) programats[k2] = info;
      });
    });

    var curtsOfi = curtsPerSeccio(edicio.id, "oficial");
    var curtsFora = curtsPerSeccio(edicio.id, "fora");

    var tots = [];
    if (state.premsaFiltreSeccio === "totes" || state.premsaFiltreSeccio === "oficial") {
      tots = tots.concat(curtsOfi.map(function (c) { return { c: c, seccio: "OFICIAL" }; }));
    }
    if (state.premsaFiltreSeccio === "totes" || state.premsaFiltreSeccio === "fora") {
      tots = tots.concat(curtsFora.map(function (c) { return { c: c, seccio: "FORA" }; }));
    }

    tots = tots.filter(function (item) {
      var c = item.c;
      var filtreTAC = state.premsaFiltreTAC;
      var filtreJuv = state.premsaFiltreJuvenil;
      if (filtreTAC || filtreJuv) {
        var passa = false;
        if (filtreTAC && c.esTac) passa = true;
        if (filtreJuv && c.esJuvenil) passa = true;
        if (!passa) return false;
      }
      if (state.premsaFiltrePais) {
        if ((c.pais || "").trim() !== state.premsaFiltrePais) return false;
      }
      return true;
    });

    if (tots.length === 0) return { capçalera: [], files: [], edicio: edicio, buit: true };

    var campsTriats = CAMPS_PREMSA.filter(function (cp) {
      return state.premsaCampsSeleccionats[cp.key];
    });

    var capçalera = ["Secció"].concat(campsTriats.map(function (cp) { return cp.label; }));

    var files = tots.map(function (item, idx) {
      var c = item.c;
      var p = programats["id:" + c.id] || programats["titol:" + normalitzarTitol(c.titol)] || null;
      var fila = [item.seccio];
      campsTriats.forEach(function (cp) {
        var v = "";
        if (cp.key === "dia") v = p ? (dataLlarga(p.dia) || p.dia) : "";
        else if (cp.key === "horaInici") v = p ? p.horaInici : "";
        else if (cp.key === "horaFi") v = p ? p.horaFi : "";
        else if (cp.key === "sala") v = p ? llocLabel(p.lloc) : "";
        else if (cp.key === "sessio") v = p ? p.nomSessio : "";
        else if (cp.key === "esJuvenil") v = c.esJuvenil ? "Sí" : "";
        else if (cp.key === "esTac") v = c.esTac ? "Sí" : "";
        else v = c[cp.key] || "";
        fila.push(v);
      });
      return fila;
    });

    return { capçalera: capçalera, files: files, edicio: edicio };
  }

   function exportarPremsaExcel() {
    var dades = construirFilesPremsaExport();
    if (!dades) { window.alert("No hi ha dades per exportar en aquesta edició."); return; }
    if (dades.buit) { window.alert("Cap curt coincideix amb els filtres aplicats."); return; }
    if (typeof XLSX === "undefined") {
      exportarPremsaCSVFallback(dades);
      return;
    }
    var aoa = [dades.capçalera].concat(dades.files);
