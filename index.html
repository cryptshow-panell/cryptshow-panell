<style>

<body>

<header>
  <h1>🎬 Agenda Sitges</h1>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <button class="active" data-filter="totes" onclick="setFiltre('totes')">Totes</button>
    <button data-filter="pendents" onclick="setFiltre('pendents')">Pendents</button>
    <button data-filter="vistes" onclick="setFiltre('vistes')">Vistes</button>
  </div>
</header>

<div id="llista"></div>

<div class="fabs">
  <button class="fab fab-share" onclick="obrirExport()" title="Exportar resum">📤</button>
  <button class="fab fab-add" onclick="obrirModal()" title="Afegir peli">＋</button>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">Nova pel·lícula</h2>
    <label>Títol</label>
    <input type="text" id="f_titol" autocomplete="off">
    <label>Dia</label>
    <input type="date" id="f_fecha">
    <label>Hora</label>
    <input type="time" id="f_hora">
    <label>Sala</label>
    <input type="text" id="f_sala" autocomplete="off">
    <label>Durada (minuts)</label>
    <input type="number" id="f_durada" min="1">
    <label>Gèneres (separats per comes)</label>
    <input type="text" id="f_genres" placeholder="Terror, Corea, Vampirs..." autocomplete="off">
    <label>Sinopsi curta</label>
    <textarea id="f_sinopsi"></textarea>
    <label>Comentari personal</label>
    <textarea id="f_comentari"></textarea>
    <label style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
      <input type="checkbox" id="f_entrada" style="width:auto; margin:0;">
      <span style="color:#e8e8e8;">Compta entrada</span>
    </label>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="tancarModal()">Cancel·lar</button>
      <button class="btn-primary" onclick="guardarPelicula()">Guardar</button>
    </div>
  </div>
</div>

<div class="modal" id="modal-export">
  <div class="modal-box">
    <h2>📤 Resum per WhatsApp</h2>
    <div class="export-box" id="export-text"></div>
    <div class="modal-actions" style="margin-top:12px;">
      <button class="btn-secondary" onclick="tancarExport()">Tancar</button>
      <button class="btn-primary" onclick="copiarExport()">📋 Copiar</button>
      <button class="btn-primary" onclick="compartirNatiu()">📲 Compartir</button>
    </div>
  </div>
</div>

<script>
const KEY = 'agenda_sitges_amic_v1';

const DADES_INICIALS = [
  {id:1, titol:"The Carpenter's Son", fecha:"2026-10-08", hora:"18:00", sala:"Tramuntana", durada:90, genres:"Terror, Bíblic, EUA", sinopsi:"Una família s'amaga a l'Egipte romà. Un noi té dubtes sobre el seu guardià, 'el fuster', i es rebella amb poders misteriosos que desfermen horrors naturals i divins.", comentari:"", entrada:true, vista:false},
  {id:2, titol:"Kill Me", fecha:"2026-10-09", hora:"13:15", sala:"Auditori", durada:104, genres:"Thriller, Comèdia negra, EUA", sinopsi:"Després d'un intent de suïcidi, en Jimmy s'alia amb la Margot, operadora del 911, per resoldre un misteri: algú va intentar matar-lo, o està lluitant contra la depressió?", comentari:"", entrada:true, vista:false},
  {id:3, titol:"The Arrow at Rest at Every Instant of its Flight", fecha:"2026-10-09", hora:"15:15", sala:"Tramuntana", durada:81, genres:"Surrealista, Comèdia, EUA", sinopsi:"Tres històries aparentment desconnectades s'uneixen a Nova York. Surrealista, còmica i reflexiva, com free jazz. En blanc i negre.", comentari:"", entrada:true, vista:false},
  {id:4, titol:"Karma", fecha:"2026-10-09", hora:"17:30", sala:"Auditori", durada:140, genres:"Thriller, Drama, França", sinopsi:"Thriller recargolat amb apunts dramàtics i una de les millors interpretacions de Marion Cotillard.", comentari:"", entrada:true, vista:false},
  {id:5, titol:"The Incomer", fecha:"2026-10-10", hora:"08:15", sala:"Auditori", durada:102, genres:"Comèdia, Folk horror, UK", sinopsi:"Folk horror sobre dos germans en una illa de les Òrcades que es defensen dels turistes. Va triomfar a Sundance.", comentari:"", entrada:false, vista:false},
  {id:6, titol:"Red Snow", fecha:"2026-10-10", hora:"12:45", sala:"Auditori", durada:97, genres:"Terror, Vampirs, Finlàndia", sinopsi:"Una adolescent emo coneix un vampir de 49 anys calb i panxut que es disfressa de Pare Noel. Massacre nadalenca!", comentari:"", entrada:true, vista:false},
  {id:7, titol:"Family Movie", fecha:"2026-10-10", hora:"16:45", sala:"Auditori", durada:100, genres:"Terror, EUA", sinopsi:"Amb Kevin Bacon i Kyra Sedgwick. Projecció especial al festival.", comentari:"", entrada:true, vista:false},
  {id:8, titol:"Too Many Beasts", fecha:"2026-10-11", hora:"15:00", sala:"Tramuntana", durada:95, genres:"Thriller, Comèdia, França", sinopsi:"Una invasió bizarra colpeja un poble francès: senglars gegants destrossen els camps de blat de moro i provoquen una guerra entre pagesos i caçadors.", comentari:"", entrada:true, vista:false},
  {id:9, titol:"Nightborn", fecha:"2026-10-11", hora:"18:15", sala:"Auditori", durada:97, genres:"Folk horror, Finlàndia", sinopsi:"Folk horror inquietant sobre la depressió postpart. La Hanna Bergholm torna al Festival després d'Ego.", comentari:"", entrada:true, vista:false},
  {id:10, titol:"Hope", fecha:"2026-10-12", hora:"08:15", sala:"Auditori", durada:160, genres:"Acció, Monstre, Corea", sinopsi:"Monster movie d'acció des de Canes. Un poble sud-coreà busca una criatura misteriosa. Amb Michael Fassbender.", comentari:"", entrada:false, vista:false},
  {id:11, titol:"The Face of Horror", fecha:"2026-10-12", hora:"11:30", sala:"Auditori", durada:126, genres:"Terror, Fantasmes, UK", sinopsi:"Adaptació de Yotsuya Kaidan a l'Anglaterra medieval. Una espectre torna per venjar-se del seu espòs adúlter.", comentari:"", entrada:true, vista:false},
  {id:12, titol:"Girl in the Night", fecha:"2026-10-12", hora:"14:15", sala:"Tramuntana", durada:100, genres:"Terror, Drama", sinopsi:"", comentari:"", entrada:true, vista:false},
  {id:13, titol:"Yellow Cake", fecha:"2026-10-12", hora:"16:15", sala:"Tramuntana", durada:100, genres:"Drama, Thriller", sinopsi:"", comentari:"", entrada:true, vista:false},
  {id:14, titol:"Tokyo Burst: The Roundup", fecha:"2026-10-15", hora:"13:30", sala:"Auditori", durada:110, genres:"Acció, Japó", sinopsi:"", comentari:"", entrada:true, vista:false},
  {id:15, titol:"El samurái y el prisionero", fecha:"2026-10-15", hora:"16:00", sala:"Auditori", durada:147, genres:"Thriller, Detectiu, Japó", sinopsi:"Segle XVI. El senyor Murashige es rebel·la contra Nobunaga Oda i s'atrinxera al seu castell. Mentre l'exèrcit s'acosta, una sèrie de crims misteriosos sumeixen la fortalesa en el caos.", comentari:"", entrada:true, vista:false},
  {id:16, titol:"Bad Lieutenant: Tokyo", fecha:"2026-10-16", hora:"14:10", sala:"Tramuntana", durada:108, genres:"Neo-noir, Policial, Japó", sinopsi:"El detectiu Yabuki, addicte a les drogues i amb deutes de joc, persegueix un assassí misteriós vinculat al crim organitzat. Quan l'emparellen amb una agent de l'FBI, els seus casos s'entrellacen.", comentari:"", entrada:true, vista:false}
];

let pelicules = JSON.parse(localStorage.getItem(KEY) || 'null') || DADES_INICIALS;
let filtre = 'totes';
let editantId = null;
let peliOpen = null;

const guardar = () => localStorage.setItem(KEY, JSON.stringify(pelicules));
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function formatDia(fecha) {
  const d = new Date(fecha + 'T00:00:00');
  const dies = ['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'];
  const mesos = ['gen','feb','març','abr','maig','juny','jul','ago','set','oct','nov','des'];
  return dies[d.getDay()] + ', ' + d.getDate() + ' ' + mesos[d.getMonth()];
}

function teSolapament(peli) {
  if (!peli.durada || !peli.hora) return false;
  const [h, m] = peli.hora.split(':').map(Number);
  const inici = h * 60 + m;
  const fi = inici + peli.durada;
  return pelicules.some(altra => {
    if (altra.id === peli.id) return false;
    if (altra.fecha !== peli.fecha || !altra.hora || !altra.durada) return false;
    const [ah, am] = altra.hora.split(':').map(Number);
    const aInici = ah * 60 + am;
    const aFi = aInici + altra.durada;
    return inici < aFi && aInici < fi;
  });
}

function render() {
  const total = pelicules.length;
  const vistes = pelicules.filter(p => p.vista).length;
  const entradesUsades = pelicules.filter(p => p.entrada).length;
  const entradesRestants = 15 - entradesUsades;

  let statsHtml = `<span>Total: <strong>${total}</strong></span>`;
  statsHtml += `<span>Vistes: <strong>${vistes}</strong></span>`;
  statsHtml += `<span>Entrades: <strong class="${entradesRestants < 0 ? 'alert' : ''}">${entradesUsades}/15</strong></span>`;
  document.getElementById('stats').innerHTML = statsHtml;

  let llista = pelicules.slice();
  if (filtre === 'pendents') llista = llista.filter(p => !p.vista);
  if (filtre === 'vistes') llista = llista.filter(p => p.vista);

  const grups = {};
  llista.forEach(p => {
    if (!grups[p.fecha]) grups[p.fecha] = [];
    grups[p.fecha].push(p);
  });
  const dies = Object.keys(grups).sort();
  const c = document.getElementById('llista');

  if (dies.length === 0) {
    c.innerHTML = '<div class="empty">Encara no hi ha pel·lícules 🎥</div>';
    return;
  }

  c.innerHTML = dies.map(dia => {
    const pels = grups[dia].slice().sort((a,b) => (a.hora||'').localeCompare(b.hora||''));
    return `<div class="day-section">
      <div class="day-title">
        <span>📅 ${formatDia(dia)}</span>
        <small>${pels.length} ${pels.length === 1 ? 'peli' : 'pelis'}</small>
      </div>
      ${pels.map(p => renderPeli(p)).join('')}
    </div>`;
  }).join('');
}

function renderPeli(p) {
  const solap = teSolapament(p);
  const isOpen = peliOpen === p.id;
  const generes = (p.genres || '').split(',').map(g => g.trim()).filter(Boolean);
  const comentariClass = p.comentari ? 'movie-comment' : 'movie-comment empty';

  return `<div class="movie ${p.vista ? 'vista' : ''} ${solap ? 'solapament' : ''} ${!p.entrada ? 'gratis' : ''} ${isOpen ? 'open' : ''}"
              onclick="toggleOpen(${p.id})">
    ${solap ? '<div class="warn-overlap">⚠️ Solapament amb una altra peli</div>' : ''}
    <div class="movie-header">
      <div class="movie-time">${p.hora || '--:--'}</div>
      <div class="movie-ticket">${p.entrada ? '🎟️' : '✅'}</div>
    </div>
    <div class="movie-title">${esc(p.titol)}</div>
    <div class="movie-meta">
      ${p.sala ? '<span class="tag">📍 ' + esc(p.sala) + '</span>' : ''}
      ${p.durada ? '<span class="tag">⏱ ' + p.durada + "'</span>" : ''}
    </div>
    ${generes.length ? '<div class="movie-genres">' + generes.map(g => `<span class="genre">${esc(g)}</span>`).join('') + '</div>' : ''}
    ${p.sinopsi ? '<div class="movie-sinopsi">' + esc(p.sinopsi) + '</div>' : ''}
    <div class="${comentariClass}">
      ${p.comentari ? '💬 ' + esc(p.comentari) : '💬 Sense comentari (toca Editar per afegir-ne)'}
    </div>
    <div class="movie-actions">
      <button class="vist ${p.vista ? 'on' : ''}" onclick="event.stopPropagation(); toggleVista(${p.id})">
        ${p.vista ? '↩️ Pendent' : '✅ Vista'}
      </button>
      <button onclick="event.stopPropagation(); obrirModal(${p.id})">✏️ Editar</button>
      <button class="del" onclick="event.stopPropagation(); eliminar(${p.id})">🗑️</button>
    </div>
  </div>`;
}

function toggleOpen(id) {
  peliOpen = peliOpen === id ? null : id;
  render();
}

function toggleVista(id) {
  const p = pelicules.find(x => x.id === id);
  if (p) { p.vista = !p.vista; guardar(); render(); }
}

function eliminar(id) {
  if (!confirm('Eliminar aquesta pel·lícula?')) return;
  pelicules = pelicules.filter(x => x.id !== id);
  guardar(); render();
}

function setFiltre(f) {
  filtre = f;
  document.querySelectorAll('.filters button').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === f));
  render();
}

function obrirModal(id) {
  editantId = id || null;
  document.getElementById('modal-title').textContent = id ? 'Editar pel·lícula' : 'Nova pel·lícula';
  if (id) {
    const p = pelicules.find(x => x.id === id);
    document.getElementById('f_titol').value = p.titol || '';
    document.getElementById('f_fecha').value = p.fecha || '';
    document.getElementById('f_hora').value = p.hora || '';
    document.getElementById('f_sala').value = p.sala || '';
    document.getElementById('f_durada').value = p.durada || '';
    document.getElementById('f_genres').value = p.genres || '';
    document.getElementById('f_sinopsi').value = p.sinopsi || '';
    document.getElementById('f_comentari').value = p.comentari || '';
    document.getElementById('f_entrada').checked = !!p.entrada;
  } else {
    ['f_titol','f_fecha','f_hora','f_sala','f_durada','f_genres','f_sinopsi','f_comentari'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('f_fecha').value = '2026-10-08';
    document.getElementById('f_entrada').checked = true;
  }
  document.getElementById('modal').classList.add('open');
}

function tancarModal() {
  document.getElementById('modal').classList.remove('open');
  editantId = null;
}

function guardarPelicula() {
  const titol = document.getElementById('f_titol').value.trim();
  const fecha = document.getElementById('f_fecha').value;
  if (!titol || !fecha) { alert('Cal omplir títol i data'); return; }

  const dades = {
    titol, fecha,
    hora: document.getElementById('f_hora').value,
    sala: document.getElementById('f_sala').value.trim(),
    durada: parseInt(document.getElementById('f_durada').value) || 0,
    genres: document.getElementById('f_genres').value.trim(),
    sinopsi: document.getElementById('f_sinopsi').value.trim(),
    comentari: document.getElementById('f_comentari').value.trim(),
    entrada: document.getElementById('f_entrada').checked
  };

  if (editantId) {
    const p = pelicules.find(x => x.id === editantId);
    Object.assign(p, dades);
  } else {
    pelicules.push({ id: Date.now(), ...dades, vista: false });
  }
  guardar(); tancarModal(); render();
}

function generarTextExport() {
  let text = '🎬 AGENDA SITGES\n\n';
  const grups = {};
  pelicules.forEach(p => {
    if (!grups[p.fecha]) grups[p.fecha] = [];
    grups[p.fecha].push(p);
  });

  Object.keys(grups).sort().forEach(dia => {
    text += '📅 ' + formatDia(dia) + '\n';
    const pels = grups[dia].sort((a,b) => (a.hora||'').localeCompare(b.hora||''));
    pels.forEach(p => {
      let titol = p.titol;
      if (titol.length > 35) titol = titol.substring(0, 32) + '...';
      text += '• ' + (p.hora || '--:--') + ' · ' + titol + ' · ' + (p.sala || '?') + '\n';
    });
    text += '\n';
  });

  text += '────────────────\n';
  text += 'Total: ' + pelicules.length + ' pel·lícules\n';
  text += '🎟️ Entrades: ' + pelicules.filter(p => p.entrada).length + '/15';
  return text;
}

function obrirExport() {
  document.getElementById('export-text').textContent = generarTextExport();
  document.getElementById('modal-export').classList.add('open');
}

function tancarExport() {
  document.getElementById('modal-export').classList.remove('open');
}

function copiarExport() {
  const text = generarTextExport();
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ Copiat! Ja el pots enganxar al WhatsApp');
  }).catch(() => {
    alert('No s\'ha pogut copiar. Selecciona el text manualment.');
  });
}

function compartirNatiu() {
  const text = generarTextExport();
  if (navigator.share) {
    navigator.share({ text }).catch(() => {});
  } else {
    copiarExport();
  }
}

if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.open('sitges-amic-v1').then(c =>
          c.match(e.request).then(r => r || fetch(e.request).then(res => {
            if (e.request.method === 'GET') c.put(e.request, res.clone());
            return res;
          }).catch(() => c.match(e.request)))
        )
      );
    });
  `;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

render();
</script>
