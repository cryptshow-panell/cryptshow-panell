<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryptshow · Panell del festival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17140f;
    --panel: #211c16;
    --panel-2: #2a231b;
    --border: #3a2f24;
    --text: #ede6d6;
    --text-dim: #a89a83;
    --accent-wine: #8c3038;
    --accent-amber: #c1863c;
    --accent-moss: #5c7a63;
    --accent-ok: #4a8c5c;
    --accent-descans: #6b5a3e;
    --accent-juv: #7a5e8a;
    --accent-tac: #4a7a8c;
    --accent-fix: #b89b5e;
    --accent-warn: #c96a3c;
    --accent-lit: #b07a4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
  }
  body { display: flex; justify-content: center; padding: 24px; min-height: 100vh; }
  .csx-root {
    width: 100%; max-width: 1300px;
    background: var(--bg);
    display: flex; min-height: 640px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .csx-sidebar {
    width: 220px; flex-shrink: 0;
    background: linear-gradient(180deg, #1d140f, #241812);
    border-right: 1px solid var(--border);
    padding: 28px 20px;
    display: flex; flex-direction: column;
  }
  .csx-brand {
    font-family: 'Fraunces', serif; font-style: italic;
    font-weight: 600; font-size: 26px; line-height: 1.1;
    color: var(--text); margin-bottom: 2px;
  }
  .csx-brand-sub {
    font-size: 11px; letter-spacing: 0.06em;
    color: var(--accent-amber); margin-bottom: 16px;
  }
  .csx-user-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 12px;
    margin-bottom: 20px;
  }
  .csx-user-email {
    font-size: 11px;
    color: var(--text-dim);
    word-break: break-all;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .csx-user-email strong { color: var(--text); font-weight: 500; }
  .csx-user-rol {
    font-size: 10px;
    color: var(--accent-amber);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .csx-user-actions { display: flex; flex-direction: column; gap: 4px; }
  .csx-logout-btn {
    background: none; border: none;
    color: var(--text-dim); font-family: inherit;
    font-size: 11px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
    padding: 0;
    text-align: left;
  }
  .csx-logout-btn:hover { color: var(--accent-wine); }
  .csx-nav { display: flex; flex-direction: column; gap: 2px; }
  .csx-nav button {
    text-align: left; background: none; border: none;
    border-left: 2px solid transparent;
    color: var(--text-dim); font-family: inherit;
    font-size: 14px; padding: 9px 12px; cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .csx-nav button:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .csx-nav button.active {
    color: var(--text);
    border-left-color: var(--accent-wine);
    background: rgba(140,48,56,0.12);
    font-weight: 500;
  }
  .csx-main { flex: 1; padding: 32px 36px; overflow-y: auto; }
  .csx-eyebrow {
    font-size: 11px; letter-spacing: 0.05em;
    color: var(--accent-amber); margin-bottom: 6px;
  }
  h2 {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 24px; margin: 0; color: var(--text);
  }
  .csx-panel { max-width: 100%; }
  .csx-panel-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 20px; border-bottom: 1px solid var(--border);
    padding-bottom: 16px; gap: 12px; flex-wrap: wrap;
  }
  .csx-form-row {
    display: flex; gap: 10px; margin-bottom: 16px;
    flex-wrap: wrap; align-items: center;
  }
  .csx-form-row input, .csx-form-row select {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px;
    font-family: inherit; font-size: 13px; border-radius: 2px;
  }
  .csx-form-row input:focus, .csx-form-row select:focus {
    outline: none; border-color: var(--accent-amber);
  }
  .csx-grow { flex: 1; min-width: 160px; }
  .csx-dur-group {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-dim);
  }
  .csx-dur-group input { text-align: center; }
  .csx-btn {
    background: var(--accent-wine); color: var(--text);
    border: none; padding: 8px 16px;
    font-family: inherit; font-size: 13px;
    cursor: pointer; border-radius: 2px;
    transition: background .15s ease;
  }
  .csx-btn:hover { background: #a3383f; }
  .csx-btn-sec {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border);
  }
  .csx-btn-sec:hover { background: var(--panel); border-color: var(--accent-amber); }
  .csx-btn-juv {
    background: var(--accent-juv); color: var(--text);
  }
  .csx-btn-juv:hover { background: #8f6fa0; }
  .csx-btn-lit {
    background: var(--accent-lit); color: var(--text);
  }
  .csx-btn-lit:hover { background: #c68a58; }
  .csx-link-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 12px; cursor: pointer; font-family: inherit;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .csx-link-btn:hover { color: var(--accent-wine); }
  .csx-empty {
    color: var(--text-dim); font-size: 13px;
    border-left: 2px solid var(--border);
    padding-left: 12px; line-height: 1.6;
  }
  .csx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .csx-table th {
    text-align: left; font-weight: 500; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px; font-size: 11px; letter-spacing: 0.04em;
  }
  .csx-table td { padding: 10px; border-bottom: 1px solid var(--border); }
  .csx-taula-cataleg { table-layout: fixed; }
  .csx-taula-cataleg th,
  .csx-taula-cataleg td {
    max-width: 140px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .csx-taula-cataleg td:nth-child(1) { max-width: 160px; }
  .csx-taula-cataleg td:nth-child(2) { max-width: 140px; }
  .csx-taula-cataleg td:nth-child(3) { max-width: 65px; }
  .csx-taula-cataleg td:nth-child(4) { max-width: 70px; }
  .csx-taula-cataleg th.col-juv,
  .csx-taula-cataleg td.col-juv,
  .csx-taula-cataleg th.col-tac,
  .csx-taula-cataleg td.col-tac {
    max-width: 45px; text-align: center;
  }
  .csx-taula-cataleg input[type="checkbox"] {
    cursor: pointer;
    width: 16px; height: 16px;
  }
  .csx-taula-cataleg input[type="checkbox"].juv-cb { accent-color: var(--accent-juv); }
  .csx-taula-cataleg input[type="checkbox"].tac-cb { accent-color: var(--accent-tac); }
  .csx-drag-handle {
    cursor: grab; color: var(--text-dim);
    width: 24px; text-align: center; letter-spacing: -1px;
  }
  .csx-table tr.csx-dragging { opacity: 0.4; }
  .csx-table tr[draggable="true"]:hover { background: rgba(255,255,255,0.02); }
  .csx-task-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
  .csx-task-list li {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 4px; border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .csx-task-list label { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
  .csx-task-list-done li span { color: var(--text-dim); text-decoration: line-through; }
  .csx-task-date { color: var(--accent-amber); font-size: 12px; }
  .csx-stat {
    background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--accent-wine);
    padding: 18px; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .csx-stat:hover { background: var(--panel-2); border-left-color: var(--accent-amber); }
  .csx-stat-num {
    display: block; font-family: 'Fraunces', serif;
    font-size: 30px; font-weight: 600; margin-bottom: 4px;
  }
  .csx-stat-label { font-size: 12px; color: var(--text-dim); }
  .csx-subnav { display: flex; gap: 8px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
  .csx-subnav button {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text-dim); padding: 7px 14px;
    font-family: inherit; font-size: 13px;
    cursor: pointer; border-radius: 2px;
  }
  .csx-subnav button.active {
    background: var(--accent-wine); color: var(--text);
    border-color: var(--accent-wine);
  }
  .csx-cicle-tab-wrap { display: inline-flex; align-items: center; gap: 2px; }
  .csx-cicle-rename {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 12px; padding: 4px 6px;
  }
  .csx-cicle-rename:hover { color: var(--accent-amber); }
  .csx-avis { color: var(--accent-amber); font-size: 13px; margin-left: 4px; }
  .csx-avis-warn { color: var(--accent-warn); font-size: 13px; margin-left: 4px; }
  .csx-day-group { margin-bottom: 24px; }
  .csx-day-header {
    font-size: 15px; color: var(--accent-amber);
    font-family: 'Fraunces', serif; font-weight: 600;
    letter-spacing: 0.03em; margin: 22px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .csx-day-header:first-child { margin-top: 0; }
  .csx-day-header.warn { color: var(--accent-warn); }
  .csx-day-subhead {
    font-size: 11px; color: var(--text-dim); margin: 8px 0 4px;
  }
  .csx-session-list { display: flex; flex-direction: column; gap: 2px; }
  .csx-session-row {
    display: flex; justify-content: space-between;
    align-items: center; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--border);
    cursor: pointer; gap: 10px;
  }
  .csx-session-row:hover { border-color: var(--accent-amber); }
  .csx-session-row.csx-descans {
    background: rgba(107,90,62,0.15);
    border-left: 3px solid var(--accent-descans);
  }
  .csx-session-row.csx-juv {
    background: rgba(122,94,138,0.12);
    border-left: 3px solid var(--accent-juv);
  }
  .csx-session-row.csx-lit {
    background: rgba(176,122,74,0.10);
    border-left: 3px solid var(--accent-lit);
  }
  .csx-session-row.csx-warn {
    border-left: 3px solid var(--accent-warn);
    background: rgba(201,106,60,0.08);
  }
  .csx-session-row-main { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; flex: 1; min-width: 0; }
  .csx-session-num {
    font-family: 'Fraunces', serif; font-weight: 600;
    color: var(--accent-amber);
  }
  .csx-session-time { color: var(--text-dim); font-size: 13px; }
  .csx-session-time.warn { color: var(--accent-warn); font-style: italic; }
  .csx-session-desc { color: var(--text-dim); font-size: 13px; font-style: italic; }
  .csx-session-sala {
    font-size: 11px;
    color: var(--accent-moss);
    border: 1px solid var(--accent-moss);
    padding: 2px 8px;
    border-radius: 10px;
    opacity: 0.85;
  }
  .csx-session-tipus {
    font-size: 11px; color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 10px;
  }
  .csx-session-tipus.juv {
    color: var(--accent-juv);
    border-color: var(--accent-juv);
  }
  .csx-session-tipus.lit {
    color: var(--accent-lit);
    border-color: var(--accent-lit);
  }
  .csx-session-count { color: var(--text-dim); font-size: 12px; flex-shrink: 0; }
  .csx-session-del {
    background: none; border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 2px;
    text-decoration: underline;
    text-underline-offset: 2px;
    flex-shrink: 0;
  }
  .csx-session-del:hover { color: var(--accent-wine); }
  .csx-fix-ico {
    color: var(--accent-fix);
    font-size: 12px;
    margin-left: 2px;
  }
  .csx-bloc-sala-header {
    font-size: 13px;
    color: var(--accent-moss);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    margin: 14px 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px dashed var(--border);
  }
  .csx-bloc-sala-header:first-child { margin-top: 0; }
  .csx-back-btn {
    background: none; border: none; color: var(--text-dim);
    font-family: inherit; font-size: 13px; cursor: pointer;
    margin-bottom: 16px; text-decoration: underline;
    text-underline-offset: 2px; padding: 0;
  }
  .csx-back-btn:hover { color: var(--accent-wine); }
  .csx-session-header {
    display: flex; gap: 16px; align-items: center;
    flex-wrap: wrap; margin-bottom: 20px;
    padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .csx-session-header input { width: auto; }

  .csx-fix-check {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-dim);
    background: rgba(184,155,94,0.10);
    border: 1px solid var(--accent-fix);
    padding: 6px 10px; border-radius: 2px;
    cursor: pointer;
  }
  .csx-fix-check input { accent-color: var(--accent-fix); cursor: pointer; }
  .csx-fix-check.sel { color: var(--text); }

  .csx-premsa-wrap {
    width: 100%; max-height: 70vh; overflow: auto;
    border: 1px solid var(--border); background: var(--panel);
  }
  .csx-taula-premsa {
    border-collapse: collapse; font-size: 12px;
    white-space: nowrap; min-width: 100%;
  }
  .csx-taula-premsa th {
    position: sticky; top: 0; background: var(--panel-2);
    z-index: 2; text-align: left; font-weight: 500;
    color: var(--accent-amber);
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 8px 10px; font-size: 11px; letter-spacing: 0.04em;
  }
  .csx-taula-premsa td {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    color: var(--text); vertical-align: middle;
  }
  .csx-taula-premsa tbody tr:hover td { background: rgba(255,255,255,0.02); }
  .csx-taula-premsa .col-num {
    font-family: 'Fraunces', serif; font-weight: 600;
    color: var(--accent-amber); text-align: right; width: 50px;
  }
  .csx-taula-premsa a { color: var(--accent-amber); }

  .csx-check-cell { text-align: center; width: 60px; }
  .csx-check-cell input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: var(--accent-wine); cursor: pointer;
  }
  .csx-url-cell input {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 7px;
    font-family: inherit; font-size: 11px;
    border-radius: 2px; width: 200px;
  }
  .csx-url-cell input:focus { outline: none; border-color: var(--accent-amber); }

  .csx-toggle-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    border-radius: 2px;
    margin-bottom: 12px;
  }
  .csx-toggle-btn:hover { border-color: var(--accent-amber); color: var(--accent-amber); }

  .csx-nota-final {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
    border-left: 2px solid var(--accent-amber);
    padding-left: 12px;
    margin-top: 24px;
    line-height: 1.6;
  }

  .csx-taula-tarifes {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .csx-taula-tarifes th {
    text-align: left; font-weight: 500; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px; font-size: 11px; letter-spacing: 0.04em;
  }
  .csx-taula-tarifes td {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  .csx-taula-tarifes input {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 8px;
    font-family: inherit; font-size: 13px; border-radius: 2px;
    width: 100%;
  }
  .csx-taula-tarifes input:focus {
    outline: none; border-color: var(--accent-amber);
  }
  .csx-taula-tarifes .nom-tarifa {
    font-family: 'Fraunces', serif; font-weight: 600;
    color: var(--text);
  }

  .csx-descans-form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-descans);
    padding: 14px 16px;
    margin-bottom: 18px;
  }

  .csx-juvenil-form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-juv);
    padding: 14px 16px;
    margin-bottom: 18px;
  }

  .csx-literari-form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-lit);
    padding: 16px 18px;
    margin-bottom: 18px;
  }

  .csx-export-form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-amber);
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .csx-camps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 6px 18px;
    margin-bottom: 14px;
  }
  .csx-camps-grid label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-dim);
    cursor: pointer;
  }
  .csx-camps-grid label input { accent-color: var(--accent-wine); }
  .csx-camps-grid label.sel { color: var(--text); }

  .csx-juv-check {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-dim);
    background: rgba(122,94,138,0.12);
    border: 1px solid var(--accent-juv);
    padding: 6px 10px; border-radius: 2px;
    cursor: pointer;
  }
  .csx-juv-check input { accent-color: var(--accent-juv); cursor: pointer; }
  .csx-juv-check.sel { color: var(--text); }

  .csx-tac-check {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-dim);
    background: rgba(74,122,140,0.12);
    border: 1px solid var(--accent-tac);
    padding: 6px 10px; border-radius: 2px;
    cursor: pointer;
  }
  .csx-tac-check input { accent-color: var(--accent-tac); cursor: pointer; }
  .csx-tac-check.sel { color: var(--text); }

  .csx-login-wrap {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; width: 100%;
    background: var(--bg);
  }
  .csx-login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-wine);
    padding: 40px 48px;
    max-width: 440px; width: 100%;
    text-align: center;
  }
  .csx-login-brand {
    font-family: 'Fraunces', serif; font-style: italic;
    font-weight: 600; font-size: 38px;
    color: var(--text); line-height: 1;
    margin-bottom: 6px;
  }
  .csx-login-sub {
    font-size: 12px; letter-spacing: 0.08em;
    color: var(--accent-amber);
    margin-bottom: 32px;
    text-transform: uppercase;
  }
  .csx-login-title {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 20px; color: var(--text);
    margin-bottom: 8px;
  }
  .csx-login-desc {
    font-size: 13px; color: var(--text-dim);
    line-height: 1.6; margin-bottom: 24px;
  }
  .csx-login-field {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 14px;
    text-align: left;
  }
  .csx-login-field label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .csx-login-field input {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    font-family: inherit; font-size: 14px;

  function detectarDelimitadorCSV(text) {
    var inQuotes = false, comes = 0, punts = 0;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (ch === '"') { inQuotes = !inQuotes; continue; }
      if (inQuotes) continue;
      if (ch === '\n' || ch === '\r') break;
      if (ch === ',') comes++;
      else if (ch === ';') punts++;
    }
    return punts > comes ? ";" : ",";
  }

  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var delim = detectarDelimitadorCSV(text);
    var rows = [], row = [], cell = "", inQuotes = false, i = 0, n = text.length;
    while (i < n) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (i + 1 < n && text[i + 1] === '"') { cell += '"'; i += 2; continue; }
          else { inQuotes = false; i++; continue; }
        } else { cell += ch; i++; continue; }
      }
      if (ch === '"') { inQuotes = true; i++; continue; }
      if (ch === delim) { row.push(cell); cell = ""; i++; continue; }
      if (ch === '\r') {
        row.push(cell); rows.push(row); row = []; cell = ""; i++;
        if (i < n && text[i] === '\n') i++;
        continue;
      }
      if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; i++; continue; }
      cell += ch; i++;
    }
    if (cell.length > 0 || row.length > 0) { row.push(cell); rows.push(row); }
    return rows
      .filter(function (r) {
        if (r.length === 0) return false;
        for (var j = 0; j < r.length; j++) { if (r[j] && r[j].trim() !== "") return true; }
        return false;
      })
      .map(function (r) { return r.map(function (c) { return (c == null ? "" : c).trim(); }); });
  }

      var plenes = allRows[i].filter(function (c) { return c && c.trim(); }).length;
      if (plenes > millorPuntuacio) { millorPuntuacio = plenes; millor = i; }

  function parsejarDurada(text) {
    var s = (text || "").toString().trim();
    if (!s) return null;
    var m0 = s.match(/^(\d{1,2})\s*[:.]\s*(\d{1,2})\s*[:.]\s*(\d{1,2})$/);
    if (m0) return { min: parseInt(m0[1], 10) * 60 + parseInt(m0[2], 10), sec: parseInt(m0[3], 10) };
    var m1 = s.match(/^(\d+)\s*[:.,]\s*(\d{1,2})$/);
    if (m1) {
      var min1 = parseInt(m1[1], 10), sec1 = parseInt(m1[2], 10);
      if (sec1 > 59) sec1 = Math.round(sec1 / 10);
      return { min: min1, sec: sec1 };
    }
    var m2 = s.match(/^(\d+)\s*['’]\s*(\d{1,2})/);
    if (m2) {
      var min2 = parseInt(m2[1], 10), sec2 = parseInt(m2[2], 10);
      if (sec2 > 59) sec2 = 0;
      return { min: min2, sec: sec2 };
    }
    var m3 = s.match(/(\d+)\s*(?:min|m)\D+?(\d+)\s*(?:s|sec)/i);
    if (m3) return { min: parseInt(m3[1], 10), sec: parseInt(m3[2], 10) };
    var m4 = s.match(/^(\d+)\s*(?:min|m|minuts?)$/i);
    if (m4) return { min: parseInt(m4[1], 10), sec: 0 };
    var m5 = s.match(/^(\d+)$/);
    if (m5) {
      var n = parseInt(m5[1], 10);
      if (n >= 60) return { min: Math.floor(n / 60), sec: n % 60 };
      return { min: n, sec: 0 };
    }
    var m6 = s.match(/^(\d+)\s*h\D*?(\d+)?/i);
    if (m6) {
      var h = parseInt(m6[1], 10), mm = m6[2] ? parseInt(m6[2], 10) : 0;
      return { min: h * 60 + mm, sec: 0 };
    }
    return null;
  }

  // ---- escapeHtml blindat ----
  function escapeHtml(str) {
    return (str == null ? "" : String(str))
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function horaAMinuts(h) {
    var p = (h || "").split(":");
    var hh = parseInt(p[0], 10); if (isNaN(hh)) hh = 0;
    var mm = p.length > 1 ? parseInt(p[1], 10) : 0; if (isNaN(mm)) mm = 0;
    return hh * 60 + mm;
  }
  function minutsAHora(mins) {
    mins = ((mins % 1440) + 1440) % 1440;
    var h = Math.floor(mins / 60), m = mins % 60;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }
  function segonsCurt(c) {
    var min = parseInt(c.durMin, 10); if (isNaN(min) || min < 0) min = 0;
    var sec = parseInt(c.durSec, 10); if (isNaN(sec) || sec < 0) sec = 0;
    return min * 60 + sec;
  }
  function sumaSegons(curts) {
    return (curts || []).reduce(function (a, c) { return a + segonsCurt(c); }, 0);
  }
  function durLabel(c) {
    var min = parseInt(c.durMin, 10); if (isNaN(min) || min < 0) min = 0;
    var sec = parseInt(c.durSec, 10); if (isNaN(sec) || sec < 0) sec = 0;
    return min + "' " + (sec < 10 ? "0" : "") + sec + "\"";
  }
  function esActivitat(it) { return !!(it && it.tipusEntitat === "activitat"); }
  function esDescans(it) { return !!(it && it.tipusEntitat === "descans"); }
  function durMinActivitat(a) {
    var h = parseInt(a.durHores, 10); if (isNaN(h) || h < 0) h = 0;
    var m = parseInt(a.durMinuts, 10); if (isNaN(m) || m < 0) m = 0;
    return h * 60 + m;
  }
  function durMinItem(it) {
    return (esActivitat(it) || esDescans(it)) ? durMinActivitat(it) : Math.ceil(sumaSegons(it.curts) / 60);
  }
  function horaFiMinuts(s) { return horaAMinuts(s.horaInici) + durMinItem(s); }
  function horaFiSessio(s) { return minutsAHora(horaFiMinuts(s)); }
  function seSolapen(a, b) {
    if (!a.dia || a.dia !== b.dia) return false;
    if (!a.horaInici || !b.horaInici) return false;
    var ai = horaAMinuts(a.horaInici), af = horaFiMinuts(a);
    var bi = horaAMinuts(b.horaInici), bf = horaFiMinuts(b);
    return ai < bf && bi < af;
  }
  function hiHaConflicteCercle(prova, totes, ignorarId) {
    if (!prova.dia || !prova.horaInici) return false;
    for (var i = 0; i < totes.length; i++) {
      var o = totes[i];
      if (o.id === ignorarId) continue;
      if (esDescans(o)) continue;
      if (esDescans(prova)) continue;
      if (o.lloc !== "cercle") continue;
      if (!o.dia || !o.horaInici) continue;
      if (seSolapen(prova, o)) return true;
    }
    return false;
  }
  function teAvisSolapament(s, totes) {
    if (esDescans(s)) return false;
    if (!s.dia || !s.horaInici) return false;
    for (var i = 0; i < totes.length; i++) {
      var o = totes[i];
      if (o.id === s.id) continue;
      if (esDescans(o)) continue;
      if (o.lloc === s.lloc) continue;
      if (!o.dia || !o.horaInici) continue;
      if (seSolapen(s, o)) return true;
    }
    return false;
  }

  // ---- LITERARI: càlcul de solapament i durada estimada ----
  function literariSeSolapen(a, b) {
    if (!a || !b) return false;
    var ai = horaAMinuts(a.horaInici || "00:00");
    var af = ai + (parseInt(a.durMin, 10) || 0);
    var bi = horaAMinuts(b.horaInici || "00:00");
    return ai < bi && af > bi;
  }

  function literariItemsAmbAvis(items) {
    // Retorna una còpia amb { _avis: bool } segons solapament amb el següent
    var copia = items.map(function (it) {
      return {
        it: it,
        avis: false
      };
    });
    for (var i = 0; i < copia.length - 1; i++) {
      var actual = copia[i].it;
      var seguent = copia[i + 1].it;
      if (!actual.durMin) continue;
      if (literariSeSolapen(actual, seguent)) copia[i].avis = true;
    }
    return copia;
  }

  // ---- LITERARI: recalcul d'hores en reordenar ----
  function recalcularHoresItems(items, ordreNou) {
    var mapItems = {};
    items.forEach(function (it) { mapItems[it.id] = it; });
    var ordenats = [];
    ordreNou.forEach(function (id) { if (mapItems[id]) ordenats.push(mapItems[id]); });
    var ambHora = ordenats.filter(function (it) { return it.horaInici; });
    if (ambHora.length === 0) return { ok: true, resultat: {} };

    var hiHaFlexible = ambHora.some(function (it) { return !it.horaFixada; });
    if (!hiHaFlexible) {
      var resultat = {};
      ambHora.forEach(function (it) { resultat[it.id] = it.horaInici; });
      return { ok: true, resultat: resultat };
    }
    var horaBase = null;
    ambHora.forEach(function (it) {
      if (!it.horaFixada) {
        var h = horaAMinuts(it.horaInici || "00:00");
        if (horaBase === null || h < horaBase) horaBase = h;
      }
    });
    var cursor = horaBase;
    var resultat = {};
    for (var i = 0; i < ambHora.length; i++) {
      var it = ambHora[i];
      if (it.horaFixada) {
        var hFix = horaAMinuts(it.horaInici || "00:00");
        if (cursor > hFix) {
          return {
            ok: false,
            missatge: "No es pot reordenar.\n\n\"" + (it.titol || "(sense títol)") + "\" està fixada a les " + (it.horaInici || "??") + ",\nperò amb el nou ordre no hi ha prou espai abans.\n\nSolucions:\n· Treure la fixació d'aquesta intervenció\n· Canviar la seva hora manualment\n· Reordenar-ho d'una altra manera"
          };
        }
        resultat[it.id] = it.horaInici;
        cursor = hFix + (parseInt(it.durMin, 10) || 0);
      } else {
        resultat[it.id] = minutsAHora(cursor);
        cursor += (parseInt(it.durMin, 10) || 0);
      }
    }
    return { ok: true, resultat: resultat };
  }

  function render() {
    if (!state.usuari) { mostrarLogin(); return; }
    if (!state.usuariCarregat) {
      mostrarPanell();
      document.getElementById("csx-nav").innerHTML = "";
      document.getElementById("csx-user-box").innerHTML = '<div class="csx-user-email">Carregant…</div>';
      document.getElementById("csx-main").innerHTML = '<p class="csx-empty">Carregant permisos…</p>';
      return;
    }
    mostrarPanell();
    renderNav();
    pintarUserBox();
    if (state.errorCarrega) {
      document.getElementById("csx-main").innerHTML =
        '<div class="csx-setup"><h2>Error de connexió amb Firebase</h2>' +
        '<p>' + escapeHtml(state.errorCarrega) + '</p>' +
        '<p>Revisa les regles de Realtime Database.</p></div>';
      return;
    }
    if (!totCarregat()) {
      document.getElementById("csx-main").innerHTML = '<p class="csx-empty">Carregant les dades del festival…</p>';
      return;
    }
    var tab = NAV.filter(function (n) { return n.id === state.tab; })[0];
    if (tab && !teAcces(state.tab)) {
      state.tab = "resum";
    }
    renderMain();
    renderModal();

  function renderNav() {
    var nav = document.getElementById("csx-nav");
    nav.innerHTML = "";
    NAV.forEach(function (n) {
      if (!teAcces(n.id)) return;
      var btn = document.createElement("button");
      btn.textContent = n.label;
      if (state.tab === n.id) btn.className = "active";
      btn.addEventListener("click", function () {
        state.tab = n.id;
        if (n.id === "premsa" || n.id === "curts") {
          var edicions = state.edicions[state.cicleActiu] || [];
          if (!state.premsaEdicio && edicions.length > 0) state.premsaEdicio = edicions[0].id;
        }
        if (n.id === "subtitols") {
          var ed2 = state.edicions[state.cicleActiu] || [];
          if (!state.subtitolsEdicio && ed2.length > 0) state.subtitolsEdicio = ed2[0].id;
        }
        if (n.id === "programacio") {
          var ed3 = state.edicions[state.cicleActiu] || [];
          if (!state.programacioEdicio && ed3.length > 0) {
            var ultima = ed3.slice().sort(function (a, b) { return (b.any || 0) - (a.any || 0); })[0];
            state.programacioEdicio = ultima.id;
          }
        }
        if (n.id === "literari") {
          var edL = state.edicions[state.cicleActiu] || [];
          if (!state.literariEdicio && edL.length > 0) {
            var ultimaL = edL.slice().sort(function (a, b) { return (b.any || 0) - (a.any || 0); })[0];
            state.literariEdicio = ultimaL.id;
          }
        }
        if (n.id === "tasques") {
          var ed4 = state.edicions[state.cicleActiu] || [];
          if (!state.tarifesEdicio && ed4.length > 0) {
            var ultimaT = ed4.slice().sort(function (a, b) { return (b.any || 0) - (a.any || 0); })[0];
            state.tarifesEdicio = ultimaT.id;
          }

        render();

  function attachModalHandlers() {
    var modal = document.getElementById("csx-modal-root");
    if (!modal) return;
    var cancel = modal.querySelector("#modal-cancel");
    if (cancel) cancel.addEventListener("click", function () { state.modal = null; render(); });
    var tancar = modal.querySelector("#modal-tancar");
    if (tancar) tancar.addEventListener("click", function () { state.modal = null; render(); });

    if (state.modal && state.modal.tipus === "crearUsuari") {
      var btn = modal.querySelector("#modal-crear-confirm");
      if (btn) btn.addEventListener("click", function () {
        var email = (modal.querySelector("#modal-email").value || "").trim().toLowerCase();
        var errorEl = modal.querySelector("#modal-error");
        function mostrarError(msg) {
          errorEl.textContent = msg;
          errorEl.style.display = "block";
        }
        if (!email) { mostrarError("Cal el correu."); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { mostrarError("El correu no sembla vàlid."); return; }
        var rolsSel = {};
        modal.querySelectorAll("[data-modal-rol]").forEach(function (cb) {
          if (cb.checked) rolsSel[cb.getAttribute("data-modal-rol")] = true;
        });
        if (Object.keys(rolsSel).length === 0) { mostrarError("Cal seleccionar almenys un rol."); return; }
        if (state.usuaris[emailKey(email)]) { mostrarError("Aquest correu ja està registrat."); return; }

        btn.disabled = true;
        btn.textContent = "Creant…";
        var password = generarContrasenyaTemporal();

        var appSecundaria = null;
        try {
          appSecundaria = firebase.initializeApp(firebaseConfig, "aux-crear-" + Date.now());
          var authAux = appSecundaria.auth();
          authAux.createUserWithEmailAndPassword(email, password).then(function () {
            var now = Date.now();
            return db.ref("cryptshow/usuaris/" + emailKey(email)).set({
              email: email,
              rols: rolsSel,
              creatEl: now,
              creatPer: state.usuari.email
            });
          }).then(function () {
            return authAux.signOut();
          }).then(function () {
            return appSecundaria.delete();
          }).then(function () {
            var rolsText = Object.keys(rolsSel).map(function (k) {
              var r = ROLS_DISPONIBLES.filter(function (x) { return x.id === k; })[0];
              return r ? r.label : k;
            }).join(", ");
            state.modal = { tipus: "credencials", creds: { email: email, password: password, rolsText: rolsText } };
            render();
          }).catch(function (err) {
            console.error("Error creant usuari", err);
            btn.disabled = false;
            btn.textContent = "Crear usuari";
            var msg = "No s'ha pogut crear l'usuari. ";
            if (err && err.code === "auth/email-already-in-use") msg += "Aquest correu ja existeix a Firebase Authentication.";
            else if (err && err.code === "auth/weak-password") msg += "La contrasenya temporal no és prou forta.";
            else if (err && err.code === "auth/invalid-email") msg += "El correu no és vàlid.";
            else msg += (err && err.message) || "Error desconegut.";
            mostrarError(msg);
            try { if (appSecundaria) appSecundaria.delete(); } catch (e) {}
          });
        } catch (e) {
          console.error("Error inicialitzant app auxiliar", e);
          btn.disabled = false;
          btn.textContent = "Crear usuari";
          mostrarError("Error inicialitzant el sistema. Torna-ho a provar.");
        }
      });
    }

    if (state.modal && state.modal.tipus === "canviarContrasenya") {
      var btn2 = modal.querySelector("#modal-pass-confirm");
      if (btn2) btn2.addEventListener("click", function () {
        var vella = modal.querySelector("#modal-pass-vella").value;
        var nova = modal.querySelector("#modal-pass-nova").value;
        var errorEl = modal.querySelector("#modal-error");
        var okEl = modal.querySelector("#modal-success");
        function mostrarError(msg) {
          errorEl.textContent = msg;
          errorEl.style.display = "block";
          okEl.style.display = "none";
        }
        if (!vella || !nova) { mostrarError("Cal omplir els dos camps."); return; }
        if (nova.length < 6) { mostrarError("La nova contrasenya ha de tenir 6 caràcters o més."); return; }
        btn2.disabled = true;
        btn2.textContent = "Canviant…";
        var credential = firebase.auth.EmailAuthProvider.credential(state.usuari.email, vella);
        state.usuari.reauthenticateWithCredential(credential).then(function () {
          return state.usuari.updatePassword(nova);
        }).then(function () {
          okEl.textContent = "Contrasenya canviada correctament.";
          okEl.style.display = "block";
          errorEl.style.display = "none";
          btn2.disabled = false;
          btn2.textContent = "Canviar";
          setTimeout(function () {
            state.modal = null;
            render();
          }, 1800);
        }).catch(function (err) {
          console.error("Error canviant contrasenya", err);
          btn2.disabled = false;
          btn2.textContent = "Canviar";
          var msg = "No s'ha pogut canviar. ";
          if (err && err.code === "auth/wrong-password") msg += "La contrasenya actual no és correcta.";
          else if (err && err.code === "auth/weak-password") msg += "La nova contrasenya no és prou forta.";
          else if (err && err.code === "auth/requires-recent-login") msg += "Cal tornar a iniciar sessió.";
          else msg += (err && err.message) || "Error desconegut.";
          mostrarError(msg);
        });
      });
    }

    if (state.modal && state.modal.tipus === "canviarRol") {
      var btn3 = modal.querySelector("#modal-rol-confirm");
      if (btn3) btn3.addEventListener("click", function () {
        var rolsSel = {};
        modal.querySelectorAll("[data-modal-rol-edit]").forEach(function (cb) {
          if (cb.checked) rolsSel[cb.getAttribute("data-modal-rol-edit")] = true;
        });
        var errorEl = modal.querySelector("#modal-error");
        if (Object.keys(rolsSel).length === 0) {
          errorEl.textContent = "Cal seleccionar almenys un rol.";
          errorEl.style.display = "block";
          return;
        }
        var email = state.modal.usuari.email;
        btn3.disabled = true;
        btn3.textContent = "Guardant…";
        db.ref("cryptshow/usuaris/" + emailKey(email) + "/rols").set(rolsSel).then(function () {
          state.modal = null;
          render();
        }).catch(function (err) {
          console.error("Error guardant rols", err);
          btn3.disabled = false;
          btn3.textContent = "Guardar";
          errorEl.textContent = "No s'ha pogut guardar.";
          errorEl.style.display = "block";
        });
      });
    }
  }

  function literariActeDetailHtml(edicio, acte) {
    var itemsOrdenats = acte.items.slice().sort(function (a, b) {
      var ha = (a.horaInici || "99:99");
      var hb = (b.horaInici || "99:99");
      if (ha !== hb) return ha.localeCompare(hb);
      var oa = (typeof a.ordre === "number") ? a.ordre : 9999;
      var ob = (typeof b.ordre === "number") ? b.ordre : 9999;
      return oa - ob;
    });

    var itemsAmbAvis = literariItemsAmbAvis(itemsOrdenats);

    var files = itemsAmbAvis.map(function (x, i) {
      var it = x.it;
      var avis = x.avis ? '<span class="csx-avis-warn" title="Se solapa amb la següent">⚠ se solapa</span>' : '';
      var fixIco = it.horaFixada ? '<span class="csx-fix-ico" title="Hora fixada">🔒</span>' : '';

      var obraTxt = it.obra ? (" · " + it.obra) : "";
      var metaParts = [];

      var meta = metaParts.length > 0 ? '<div class="csx-lit-item-meta">' + metaParts.join(" · ") + '</div>' : '';
      var desc = it.descripcio ? '<div class="csx-lit-item-desc">' + escapeHtml(it.descripcio) + '</div>' : '';

      return '<div class="csx-lit-item" draggable="true" data-lit-item="' + it.id + '">' +
        '<span class="csx-drag-handle">⠿</span>' +
        '<div class="csx-lit-item-main">' +
        '<div class="csx-lit-item-head">' +
        '<span class="csx-lit-item-hora">' + escapeHtml(it.horaInici || "—") + '–' + (it.durMin ? minutsAHora(horaAMinuts(it.horaInici || "00:00") + it.durMin) : "—") + fixIco + '</span>' +
        '<span class="csx-lit-item-tipus">' + escapeHtml(it.tipus || "Xerrada") + '</span>' +

        avis +
        '</div>' + meta + desc +
        '</div>' +
        '<div class="csx-lit-item-accions">' +
        '<button data-lit-pujar="' + it.id + '" title="Pujar">▲ pujar</button>' +

        '<button data-lit-editar="' + it.id + '">editar</button>' +
        '<button class="del" data-lit-eliminar-item="' + it.id + '">eliminar</button>' +
        '</div>' +
        '</div>';
    }).join("");

    var llista = itemsOrdenats.length === 0
      ? '<p class="csx-empty">Encara no hi ha cap intervenció en aquest acte. Afegeix-ne una a sota.</p>'
      : '<div class="csx-lit-llista" id="lit-llista-items">' + files + '</div>';

    var metaActe = '<div class="csx-lit-acte-header">' +
      '<h3>' + escapeHtml(acte.nom || "Acte literari") + (acte.numEdicio ? ' <span style="font-size:13px;color:var(--accent-lit);">· ' + escapeHtml(acte.numEdicio) + '</span>' : '') + '</h3>' +
      '<div class="meta">' +
      (acte.dia ? '<strong>Dia:</strong> ' + escapeHtml(dataLlarga(acte.dia)) + '<br>' : '') +
      (acte.lloc ? '<strong>Lloc:</strong> ' + escapeHtml(acte.lloc) + '<br>' : '') +
      (acte.entrada ? '<strong>Entrada:</strong> ' + escapeHtml(acte.entrada) + '<br>' : '') +
      (acte.presentador ? '<strong>Presentador/a:</strong> ' + escapeHtml(acte.presentador) + '<br>' : '') +
      (acte.moderadors && acte.moderadors.length > 0 ? '<strong>Moderadors:</strong> ' + escapeHtml(acte.moderadors.join(", ")) + '<br>' : '') +
      (acte.colaboradors && acte.colaboradors.length > 0 ? '<strong>Col·laboradors:</strong> ' + escapeHtml(acte.colaboradors.join(", ")) : '') +
      '</div>' +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="csx-link-btn" id="lit-editar-acte">✎ editar metadades de l\'acte</button>' +
      '</div>' +

    var formEdicioActe = state.literariEditarActe ? literariEditarActeFormHtml(acte) : "";

    var formItem = literariItemFormHtml(acte);

    return metaActe + formEdicioActe + llista + formItem;

  function literariEditarActeFormHtml(acte) {

  function literariLlistaTextosHtml(llista, camp) {

  function literariItemFormHtml(acte) {

    var fixSel = valors.horaFixada ? " checked" : "";

    var tipusOpcions = TIPUS_LITERARI.map(function (t) {

  // ---- Programació oficial (versió amb literari integrat) ----
  function programacioOficialHtml() {
    var edicions = state.edicions[state.cicleActiu] || [];

    if (!state.programacioEdicio && edicions.length > 0) {
      var ultimaSel = edicions.slice().sort(function (a, b) { return (b.any || 0) - (a.any || 0); })[0];
      state.programacioEdicio = ultimaSel.id;
    }

    var edicioId = state.programacioEdicio;
    var edicio = edicions.filter(function (e) { return e.id === edicioId; })[0];

    var selectEdicio = '<select id="prog-edicio">' +
      (edicions.length === 0 ? '<option value="">(cap edició)</option>' : "") +
      edicions.slice().sort(function (a, b) { return (b.any || 0) - (a.any || 0); }).map(function (e) {
        var lbl = e.nom ? e.nom + " (" + e.any + ")" : "Edició " + e.any;
        return '<option value="' + e.id + '"' + (e.id === edicioId ? " selected" : "") + '>' + escapeHtml(lbl) + '</option>';
      }).join("") + '</select>';

    if (!edicio) {
      return '<div class="csx-panel-head"><div><div class="csx-eyebrow">Programació Oficial</div>' +
        '<h2>Selecciona una edició</h2></div><div>' + selectEdicio + '</div></div>' +
        '<p class="csx-empty">Encara no hi ha cap edició creada en aquest cicle. Ves a <button class="csx-link-btn" data-nav="edicions">Edicions</button> per crear-ne una.</p>';
    }

    var sessionsEd = sessionsPerCicle(state.cicleActiu, edicio.id);
    var activitatsEd = activitatsEdicio(edicio.id);

    if (state.sessioOberta && !sessionsEd.some(function (s) { return s.id === state.sessioOberta && !esSessioJuvenil(s); })) {
      state.sessioOberta = null;
    }
    if (state.juvenilOberta && !sessionsEd.some(function (s) { return s.id === state.juvenilOberta && esSessioJuvenil(s); })) {
      state.juvenilOberta = null;
    }
    if (state.activitatOberta && !activitatsEd.some(function (a) { return a.id === state.activitatOberta && !esDescans(a); })) {
      state.activitatOberta = null;
    }
    if (state.descansOberta && !activitatsEd.some(function (a) { return a.id === state.descansOberta && esDescans(a); })) {
      state.descansOberta = null;
    }

    var oberta = state.sessioOberta ? sessionsEd.filter(function (s) { return s.id === state.sessioOberta && !esSessioJuvenil(s); })[0] : null;
    var juvOberta = state.juvenilOberta ? sessionsEd.filter(function (s) { return s.id === state.juvenilOberta && esSessioJuvenil(s); })[0] : null;
    var actOberta = state.activitatOberta ? activitatsEd.filter(function (a) { return a.id === state.activitatOberta && !esDescans(a); })[0] : null;
    var desOberta = state.descansOberta ? activitatsEd.filter(function (a) { return a.id === state.descansOberta && esDescans(a); })[0] : null;

    var body;
    var titol;
    if (oberta) {
      var tots = sessionsEd.concat(activitatsEd);
      body = sessioDetailHtml(state.cicleActiu, edicio, oberta, tots);
      titol = "Sessió";
    } else if (juvOberta) {
      var totsJ = sessionsEd.concat(activitatsEd);
      body = juvenilDetailHtml(state.cicleActiu, edicio, juvOberta, totsJ);
      titol = "Sessió Juvenil";
    } else if (actOberta) {
      var tots2 = sessionsEd.concat(activitatsEd);
      body = activitatDetailHtml(edicio, actOberta, tots2);
      titol = "Activitat";
    } else if (desOberta) {
      var totsD = sessionsEd.concat(activitatsEd);
      body = descansDetailHtml(edicio, desOberta, totsD);
      titol = "Descans";
    } else {
      var tots3 = sessionsEd.concat(activitatsEd);
      body = llistaProgramadaHtml(tots3, edicio);
      titol = edicioLabel(edicio);
    }

    var botonsExport = "";
    var toggleAgrup = "";
    if (!oberta && !juvOberta && !actOberta && !desOberta) {
      toggleAgrup = '<div style="display:inline-flex;gap:0;border:1px solid var(--border);border-radius:2px;overflow:hidden;">' +
        '<button class="' + (state.programacioAgrupacio === "hora" ? "active" : "") + '" data-agrupacio="hora" ' +
        'style="background:' + (state.programacioAgrupacio === "hora" ? "var(--accent-wine)" : "var(--panel-2)") + ';' +
        'color:' + (state.programacioAgrupacio === "hora" ? "var(--text)" : "var(--text-dim)") + ';' +
        'border:none;padding:7px 14px;font-family:inherit;font-size:12px;cursor:pointer;">Per hora</button>' +
        '<button class="' + (state.programacioAgrupacio === "sala" ? "active" : "") + '" data-agrupacio="sala" ' +
        'style="background:' + (state.programacioAgrupacio === "sala" ? "var(--accent-wine)" : "var(--panel-2)") + ';' +
        'color:' + (state.programacioAgrupacio === "sala" ? "var(--text)" : "var(--text-dim)") + ';' +
        'border:none;border-left:1px solid var(--border);padding:7px 14px;font-family:inherit;font-size:12px;cursor:pointer;">Per sala</button>' +
        '</div>';
      botonsExport = '<div style="display:flex;gap:8px;align-items:center;">' +
        toggleAgrup +
        '<button class="csx-btn csx-btn-sec" id="prog-afegir-descans">+ Afegir descans</button>' +
        '<button class="csx-btn csx-btn-sec" id="prog-export-csv">Exportar CSV</button>' +
        '<button class="csx-btn csx-btn-sec" id="prog-export-pdf">Exportar PDF</button>' +
        '</div>';
    }

    var formDescans = "";
    if (state.descansForm && !oberta && !juvOberta && !actOberta && !desOberta) {
      formDescans = descansFormHtml(edicio.id);
    }

    var teLit = !!literariPerEdicio(edicio.id);
    var botoLit = teLit
      ? '<button class="csx-btn csx-btn-lit" id="prog-obrir-literari" type="button" style="margin-left:8px;">📖 Obrir a Literari</button>'
      : '';

    return '<div class="csx-panel-head"><div>' +
      '<div class="csx-eyebrow">Programació Oficial · ' + escapeHtml(cicleLabel(CICLES.filter(function (c) { return c.id === state.cicleActiu; })[0])) + '</div>' +
      '<h2>' + escapeHtml(titol) + '</h2></div><div style="display:flex;gap:8px;align-items:center;">' + selectEdicio + botonsExport + botoLit + '</div></div>' +
      '<p style="font-size:12px;color:var(--text-dim);margin:-8px 0 16px;">Treballant a: <strong style="color:var(--text);">' + escapeHtml(edicioLabel(edicio)) + '</strong></p>' +
      formDescans +
      body;
  }

  function llistaProgramadaHtml(tots, edicio) {
    if (tots.length === 0 && !literariPerEdicio(edicio.id)) {
      return '<p class="csx-empty">Encara no hi ha res programat en aquesta edició.</p>' +
        '<p class="csx-nota-final">' + escapeHtml(NOTA_FINAL_PROGRAMACIO) + '</p>';
    }

    var perDia = {};
    tots.forEach(function (it) {
      var dia = (it.dia || "").trim();
      if (!perDia[dia]) perDia[dia] = [];
      perDia[dia].push(it);
    });

    var acteLit = literariPerEdicio(edicio.id);
    if (acteLit && acteLit.dia) {
      var diaLit = acteLit.dia;
      if (!perDia[diaLit]) perDia[diaLit] = [];
      // No afegim l'acte com a item de programació; el mostrem com a bloc a part
    }

    var dies = Object.keys(perDia).sort(function (a, b) {
      if (a === "" && b !== "") return -1;
      if (b === "" && a !== "") return 1;
      return a.localeCompare(b);
    });

    // Si l'acte literari té un dia que no apareix a perDia, l'afegim
    if (acteLit && acteLit.dia && dies.indexOf(acteLit.dia) === -1) {
      dies.push(acteLit.dia);
      dies.sort(function (a, b) {
        if (a === "" && b !== "") return -1;
        if (b === "" && a !== "") return 1;
        return a.localeCompare(b);
      });
    }

    var html = dies.map(function (dia) {
      var items = (perDia[dia] || []).slice().sort(function (a, b) {
        return (a.horaInici || "99:99").localeCompare(b.horaInici || "99:99");
      });
      var diaCls = dia === "" ? " warn" : "";
      var diaTxt = dia === "" ? "⚠ Sense dia assignat" : (dataLlarga(dia) || "Sense dia");
      var contingut;
      if (state.programacioAgrupacio === "sala") {
        contingut = renderBlocsSalaHtml(items, tots, edicio, dia);
      } else {
        contingut = '<div class="csx-session-list" data-llista-dia="' + escapeHtml(dia) + '">' +
          items.map(function (it) { return filaItemHtml(it, tots, edicio, true); }).join("") +
          '</div>';
      }
      var blocLit = "";
      if (acteLit && acteLit.dia === dia) {
        blocLit = renderLiterariBlocHtml(acteLit);
      }
      return '<div class="csx-day-group" data-dia="' + escapeHtml(dia) + '">' +
        '<div class="csx-day-header' + diaCls + '">' + escapeHtml(diaTxt) + '</div>' +
        contingut +
        blocLit +
        '</div>';
    }).join("");

    html += '<p class="csx-nota-final">' + escapeHtml(NOTA_FINAL_PROGRAMACIO) + '</p>';
    return html;
  }

      function renderLiterariBlocHtml(acte) {
    var items = (acte.items || []).slice().sort(function (a, b) {
      return (a.horaInici || "99:99").localeCompare(b.horaInici || "99:99");
    });
    var files = items.map(function (it) {
      return '<div class="csx-session-row csx-lit" style="cursor:default;">' +
        '<div class="csx-session-row-main">' +
        '<span class="csx-session-time">' + escapeHtml(it.horaInici || "—") + (it.durMin ? '–' + minutsAHora(horaAMinuts(it.horaInici || "00:00") + it.durMin) : '') + '</span>' +
        '<span class="csx-session-num">' + escapeHtml(it.titol || "(sense títol)") + '</span>' +
        '<span class="csx-session-tipus lit">' + escapeHtml(it.tipus || "Xerrada") + '</span>' +
        (it.convidats && it.convidats.length > 0 ? '<span class="csx-session-desc">' + escapeHtml(it.convidats.join(", ")) + '</span>' : '') +
        '</div>' +
        '</div>';
    }).join("");
    var dataTxt = acte.dia ? dataLlarga(acte.dia) : "";
    return '<div class="csx-bloc-sala-header" style="color:var(--accent-lit);border-bottom-color:var(--accent-lit);">' +
      '📖 ' + escapeHtml(acte.nom || "Cryptshow Literari") +
      (acte.numEdicio ? ' · ' + escapeHtml(acte.numEdicio) : '') +
      (dataTxt ? ' · ' + escapeHtml(dataTxt) : '') +
      (acte.lloc ? ' · ' + escapeHtml(acte.lloc) : '') +
      '</div>' +
      '<div class="csx-session-list" style="margin-bottom:14px;">' + files + '</div>';
  }

  function descansFormHtml(edId) {
    var f = state.descansForm;
    var fixSel = f.horaFixada ? " checked" : "";
    var fixCls = f.horaFixada ? " sel" : "";
    return '<div class="csx-descans-form">' +
      '<div class="csx-eyebrow" style="margin-bottom:10px;">Nou descans</div>' +
      '<div class="csx-form-row" style="margin-bottom:0;">' +
      '<input id="d-nom" class="csx-grow" placeholder="Nom (ex: Descans)" value="' + escapeHtml(f.nom || "Descans") + '">' +
      '<div class="csx-dur-group">' +
      '<input type="number" id="d-dur-hores" min="0" style="width:50px;" placeholder="0" value="' + escapeHtml(f.durHores || "") + '"><span>h</span>' +
      '<input type="number" id="d-dur-minuts" min="0" max="59" style="width:50px;" placeholder="0" value="' + escapeHtml(f.durMinuts || "") + '"><span>min</span>' +
      '</div>' +
      '<label class="csx-fix-check' + fixCls + '">' +
      '<input type="checkbox" id="d-fixada"' + fixSel + '> Hora fixa</label>' +
      '<button class="csx-btn" id="d-crear">Crear</button>' +
      '<button class="csx-link-btn" id="d-cancelar">cancel·lar</button>' +
      '</div>' +
      '<p style="font-size:11px;color:var(--text-dim);margin:8px 0 0;">El descans es crearà al primer dia de l\'edició (sala El Circol) i el podràs arrossegar on vulguis.</p>' +
      '</div>';
  }

  function juvenilFormHtml(edicioId) {
    if (!state.juvenilForm) state.juvenilForm = { nom: "", dia: "", horaInici: "", lloc: "cercle", tarifaId: "", descripcio: "", horaFixada: false };
    var f = state.juvenilForm;
    var formLloc = esFestival(state.cicleActiu)
      ? '<select id="j-lloc">' + opcionsLlocActivitatHtml(f.lloc || "cercle") + '</select>' : "";
    var selectTarifes = opcionsTarifesHtmlJuv(edicioId, f.tarifaId || "");
    var fixSel = f.horaFixada ? " checked" : "";
    var fixCls = f.horaFixada ? " sel" : "";
    return '<div class="csx-juvenil-form">' +
      '<div class="csx-eyebrow" style="margin-bottom:10px;color:var(--accent-juv);">Nova sessió juvenil</div>' +
      '<div class="csx-form-row" style="margin-bottom:10px;">' +
      '<input id="j-nom" class="csx-grow" placeholder="Nom (ex: Sessió Juvenil 1)" value="' + escapeHtml(f.nom || "") + '">' +
      '<input type="date" id="j-dia" value="' + escapeHtml(f.dia || "") + '">' +
      '<input type="time" id="j-hora" value="' + escapeHtml(f.horaInici || "") + '">' +
      formLloc +
      selectTarifes +
      '<label class="csx-fix-check' + fixCls + '">' +
      '<input type="checkbox" id="j-fixada"' + fixSel + '> Hora fixa</label>' +
      '</div>' +
      '<div class="csx-form-row" style="margin-bottom:10px;">' +
      '<input id="j-descripcio" class="csx-grow" placeholder="Descripció" value="' + escapeHtml(f.descripcio || "") + '">' +
      '</div>' +
      '<div class="csx-form-row" style="margin-bottom:0;">' +
      '<button class="csx-btn csx-btn-juv" id="j-crear">Crear sessió juvenil</button>' +
      '<button class="csx-link-btn" id="j-cancelar">cancel·lar</button>' +
      '</div>' +
      '</div>';
  }

  function renderBlocsSalaHtml(items, tots, edicio, dia) {
    var blocs = [];
    var blocActual = null;
    items.forEach(function (it) {
      var lloc = it.lloc || "cercle";
      if (!blocActual || blocActual.lloc !== lloc) {
        blocActual = { lloc: lloc, items: [it] };
        blocs.push(blocActual);
      } else {
        blocActual.items.push(it);
      }
    });
    return blocs.map(function (b) {
      return '<div class="csx-bloc-sala-header">' + escapeHtml(llocLabel(b.lloc)) + '</div>' +
        '<div class="csx-session-list" data-llista-dia="' + escapeHtml(dia) + '" data-llista-sala="' + escapeHtml(b.lloc) + '">' +
        b.items.map(function (it) { return filaItemHtml(it, tots, edicio, true); }).join("") +
        '</div>';
    }).join("");
  }

  function filaItemHtml(it, tots, edicio, mostrarSala) {
    var esAct = esActivitat(it);
    var esJuv = esSessioJuvenil(it);
    var esDes = esDescans(it);
    var titol = esAct ? (it.titol || "(sense títol)") : (it.nom || "(sense nom)");
    var sala = llocLabel(it.lloc || "cercle");
    var preu = textPreuSessio(it, edicio.id);
    var nCurts = it.curts ? it.curts.length : 0;
    var etiquetaTipus = esJuv ? "Sessió Juvenil" : (esAct ? "Activitat" : (esDes ? "Descans" : "Sessió"));
    var avis = teAvisSolapament(it, tots) ? '<span class="csx-avis" title="Solapa">⚠</span>' : "";
    var fixIco = it.horaFixada ? '<span class="csx-fix-ico" title="Hora fixada">🔒</span>' : "";
    var draggableAttr = ' draggable="true" data-drag-item="' + it.id + '"';
    var dataObrir = esAct ? 'data-obrir-activitat="' + it.id + '"'
                   : esJuv ? 'data-obrir-juvenil="' + it.id + '"'
                   : esDes ? 'data-obrir-descans="' + it.id + '"'
                   : 'data-obrir-sessio="' + it.id + '"';
    var cls = "";
    if (esDes) cls = " csx-descans";
    else if (esJuv) cls = " csx-juv";
    var faltaDia = !it.dia;
    var faltaHora = !it.horaInici;
    if (faltaDia || faltaHora) cls += " csx-warn";

    var textHora;
    if (faltaHora) {
      textHora = '<span class="csx-session-time warn">⚠ Falta hora</span>';
    } else {
      textHora = '<span class="csx-session-time">' + escapeHtml(it.horaInici) + '–' + horaFiSessio(it) + fixIco + '</span>';
    }

    var durTxt = "";
    if (esDes) {
      var h = parseInt(it.durHores, 10); if (isNaN(h) || h < 0) h = 0;
      var m = parseInt(it.durMinuts, 10); if (isNaN(m) || m < 0) m = 0;
      if (h > 0 && m > 0) durTxt = h + "h " + m + "min";
      else if (h > 0) durTxt = h + "h";
      else durTxt = m + "min";
    }

    return '<div class="csx-session-row' + cls + '" ' + dataObrir + draggableAttr + ' data-item-id="' + it.id + '">' +
      '<div class="csx-session-row-main">' +
      '<span class="csx-drag-handle">⠿</span>' +
      textHora +
      '<span class="csx-session-num">' + escapeHtml(titol) + '</span>' +
      (it.descripcio ? '<span class="csx-session-desc">' + escapeHtml(it.descripcio) + '</span>' : '') +
      (mostrarSala ? '<span class="csx-session-sala">' + escapeHtml(sala) + '</span>' : '') +
      '<span class="csx-session-tipus' + (esJuv ? ' juv' : '') + '">' + escapeHtml(etiquetaTipus) + '</span>' +
      (durTxt ? '<span class="csx-session-tipus" style="color:var(--accent-descans);border-color:var(--accent-descans);">' + durTxt + '</span>' : "") +
      (preu ? '<span class="csx-session-tipus" style="color:var(--accent-amber);border-color:var(--accent-amber);">' + escapeHtml(preu) + '</span>' : "") +
      avis +
      '</div>' +
      '<span class="csx-session-count">' + ((esAct || esDes) ? "" : nCurts + ' curts') + '</span>' +
      '<button class="csx-session-del" data-del-item="' + it.id + '">eliminar</button>' +
      '</div>';
  }

  // ---- Resta de funcions existents (sense canvis) ----
  function programacioFitxesHtml() {
    var edicions = state.edicions[state.cicleActiu] || [];

    if (!state.programacioEdicio && edicions.length > 0) {
      var ultimaSel = edicions.slice().sort(function (a, b) { return (b.any || 0) - (a.any || 0); })[0];
      state.programacioEdicio = ultimaSel.id;
    }

    var edicioId = state.programacioEdicio;
    var edicio = edicions.filter(function (e) { return e.id === edicioId; })[0];

    var selectEdicio = '<select id="prog-edicio-fitxes">' +
      (edicions.length === 0 ? '<option value="">(cap edició)</option>' : "") +
      edicions.slice().sort(function (a, b) { return (b.any || 0) - (a.any || 0); }).map(function (e) {
        var lbl = e.nom ? e.nom + " (" + e.any + ")" : "Edició " + e.any;
        return '<option value="' + e.id + '"' + (e.id === edicioId ? " selected" : "") + '>' + escapeHtml(lbl) + '</option>';
      }).join("") + '</select>';

    if (!edicio) {
      return '<div class="csx-panel-head"><div><div class="csx-eyebrow">Fitxes de creació</div>' +
        '<h2>Selecciona una edició</h2></div><div>' + selectEdicio + '</div></div>' +
        '<p class="csx-empty">Encara no hi ha cap edició creada en aquest cicle. Ves a <button class="csx-link-btn" data-nav="edicions">Edicions</button> per crear-ne una.</p>';
    }

    if (!state.juvenilForm) {
      state.juvenilForm = { nom: "", dia: "", horaInici: "", lloc: "cercle", tarifaId: "", descripcio: "", horaFixada: false };
    }

    var sessionsEd = sessionsPerCicle(state.cicleActiu, edicio.id);
    var activitatsEd = activitatsEdicio(edicio.id).filter(function (a) { return !esDescans(a); });

    var oberta = state.sessioOberta ? sessionsEd.filter(function (s) { return s.id === state.sessioOberta && !esSessioJuvenil(s); })[0] : null;
    var juvOberta = state.juvenilOberta ? sessionsEd.filter(function (s) { return s.id === state.juvenilOberta && esSessioJuvenil(s); })[0] : null;
    var actOberta = state.activitatOberta ? activitatsEd.filter(function (a) { return a.id === state.activitatOberta; })[0] : null;

    if (oberta) {
      var totsD = sessionsPerCicle(state.cicleActiu, edicio.id).concat(activitatsEdicio(edicio.id));
      return '<div class="csx-panel-head"><div>' +
        '<div class="csx-eyebrow">Fitxes de creació · ' + escapeHtml(cicleLabel(CICLES.filter(function (c) { return c.id === state.cicleActiu; })[0])) + '</div>' +
        '<h2>Sessió</h2></div><div>' + selectEdicio + '</div></div>' +
        '<p style="font-size:12px;color:var(--text-dim);margin:-8px 0 16px;">Treballant a: <strong style="color:var(--text);">' + escapeHtml(edicioLabel(edicio)) + '</strong></p>' +
        sessioDetailHtml(state.cicleActiu, edicio, oberta, totsD);
    }

    if (juvOberta) {
      var totsJ = sessionsPerCicle(state.cicleActiu, edicio.id).concat(activitatsEdicio(edicio.id));
      return '<div class="csx-panel-head"><div>' +
        '<div class="csx-eyebrow">Fitxes de creació · ' + escapeHtml(cicleLabel(CICLES.filter(function (c) { return c.id === state.cicleActiu; })[0])) + '</div>' +
        '<h2>Sessió Juvenil</h2></div><div>' + selectEdicio + '</div></div>' +
        '<p style="font-size:12px;color:var(--text-dim);margin:-8px 0 16px;">Treballant a: <strong style="color:var(--text);">' + escapeHtml(edicioLabel(edicio)) + '</strong></p>' +
        juvenilDetailHtml(state.cicleActiu, edicio, juvOberta, totsJ);
    }

    if (actOberta) {
      var totsD2 = sessionsEd.concat(activitatsEd);
      return '<div class="csx-panel-head"><div>' +
        '<div class="csx-eyebrow">Fitxes de creació · ' + escapeHtml(cicleLabel(CICLES.filter(function (c) { return c.id === state.cicleActiu; })[0])) + '</div>' +
        '<h2>Activitat</h2></div><div>' + selectEdicio + '</div></div>' +
        '<p style="font-size:12px;color:var(--text-dim);margin:-8px 0 16px;">Treballant a: <strong style="color:var(--text);">' + escapeHtml(edicioLabel(edicio)) + '</strong></p>' +
        activitatDetailHtml(edicio, actOberta, totsD2);
    }

    var tots = sessionsEd.concat(activitatsEd).slice().sort(function (a, b) {
      return ((a.dia || "") + (a.horaInici || "")).localeCompare((b.dia || "") + (b.horaInici || ""));
    });

    var llistat = tots.length === 0
      ? '<p class="csx-empty">Encara no hi ha cap sessió ni activitat creada.</p>'
      : tots.map(function (it) {
        var esAct = esActivitat(it);
        var esJuv = esSessioJuvenil(it);
        var titol = esAct ? (it.titol || "(sense títol)") : (it.nom || "(sense nom)");
        var hora;
        if (!it.horaInici) hora = '<span class="csx-session-time warn">⚠ Falta hora</span>';
        else hora = escapeHtml(it.horaInici) + '–' + horaFiSessio(it);
        var diaTxt = it.dia ? dataLlarga(it.dia) : '<span class="csx-session-time warn">⚠ Falta dia</span>';
        var preu = textPreuSessio(it, edicio.id);
        var etiqueta = esJuv ? "Sessió Juvenil" : (esAct ? "Activitat" : "Sessió");
        var dades = esJuv ? 'data-obrir-juvenil="' + it.id + '"' : (esAct ? 'data-obrir-activitat="' + it.id + '"' : 'data-obrir-sessio="' + it.id + '"');
        var fixIco = it.horaFixada ? ' <span class="csx-fix-ico" title="Hora fixada">🔒</span>' : '';
        var cls = esJuv ? ' csx-juv' : '';
        if (!it.dia || !it.horaInici) cls += ' csx-warn';
        return '<div class="csx-session-row' + cls + '" ' + dades + '>' +
          '<div class="csx-session-row-main">' +
          '<span class="csx-session-time">' + diaTxt + '</span>' +
          '<span class="csx-session-time">' + hora + fixIco + '</span>' +
          '<span class="csx-session-num">' + escapeHtml(titol) + '</span>' +
          (it.descripcio ? '<span class="csx-session-desc">' + escapeHtml(it.descripcio) + '</span>' : '') +
          '<span class="csx-session-tipus' + (esJuv ? ' juv' : '') + '">' + etiqueta + '</span>' +
          (preu ? '<span class="csx-session-tipus" style="color:var(--accent-amber);border-color:var(--accent-amber);">' + escapeHtml(preu) + '</span>' : "") +
          '</div>' +
          '<span class="csx-session-count">' + (esAct ? "" : (it.curts ? it.curts.length : 0) + ' curts') + '</span>' +
          '<button class="csx-session-del" data-del-item="' + it.id + '">eliminar</button>' +
          '</div>';
      }).join("");

    var formLloc = esFestival(state.cicleActiu)
      ? '<select id="s-lloc">' + opcionsLlocSessioHtml(novaSessioForm.lloc) + '</select>' : "";

    var selectTarifes = opcionsTarifesHtml(edicio.id, novaSessioForm.tarifaId);
    var sFixSel = novaSessioForm.horaFixada ? " checked" : "";
    var sFixCls = novaSessioForm.horaFixada ? " sel" : "";

    return '<div class="csx-panel-head"><div>' +
      '<div class="csx-eyebrow">Fitxes de creació · ' + escapeHtml(cicleLabel(CICLES.filter(function (c) { return c.id === state.cicleActiu; })[0])) + '</div>' +
      '<h2>Nova sessió, activitat o sessió juvenil</h2></div><div>' + selectEdicio + '</div></div>' +
      '<p style="font-size:12px;color:var(--text-dim);margin:-8px 0 16px;">Treballant a: <strong style="color:var(--text);">' + escapeHtml(edicioLabel(edicio)) + '</strong></p>' +

      '<div class="csx-day-subhead" style="font-size:13px;color:var(--text);margin-top:12px;">Nova sessió</div>' +
      '<div class="csx-form-row">' +
      '<input id="s-nom" class="csx-grow" placeholder="Nom de la sessió" value="' + escapeHtml(novaSessioForm.nom || "") + '">' +
      '<input type="date" id="s-dia" value="' + escapeHtml(novaSessioForm.dia) + '">' +
      '<input type="time" id="s-hora" value="' + escapeHtml(novaSessioForm.horaInici) + '">' +
      formLloc +
      '<select id="s-tipus">' + opcionsTipusHtml(novaSessioForm.tipus) + '</select>' +
      selectTarifes +
      '<label class="csx-fix-check' + sFixCls + '">' +
      '<input type="checkbox" id="s-fixada"' + sFixSel + '> Hora fixa</label>' +
      '</div>' +
      '<div class="csx-form-row">' +
      '<input id="s-descripcio" class="csx-grow" placeholder="Descripció (opcional)" value="' + escapeHtml(novaSessioForm.descripcio || "") + '">' +
      '<button class="csx-btn" id="s-crear">Crear sessió</button>' +
      '</div>' +

      '<div class="csx-day-subhead" style="font-size:13px;color:var(--text);margin-top:20px;">Nova activitat</div>' +
      activitatFormHtml(edicio.id) +

      '<div class="csx-day-subhead" style="font-size:13px;color:var(--accent-juv);margin-top:20px;">Nova sessió juvenil</div>' +
      juvenilFormHtml(edicio.id) +

      '<div class="csx-day-subhead" style="font-size:13px;color:var(--text);margin-top:28px;">Creades en aquesta edició</div>' +
      llistat;
  }

  function opcionsTipusHtml(val) {
    return TIPUS_SESSIO.map(function (t) {
      return '<option value="' + t + '"' + (val === t ? " selected" : "") + '>' + t + '</option>';
    }).join("");
  }
  function opcionsLlocSessioHtml(val) {
    var op = [
      { v: "cercle", l: "El Circol" },
      { v: "altres", l: state.llocAltresNom || "Altres" }
    ];
    return op.map(function (o) {
      return '<option value="' + o.v + '"' + (val === o.v ? " selected" : "") + '>' + escapeHtml(o.l) + '</option>';
    }).join("");
  }
  function opcionsLlocActivitatHtml(val) {
    var op = [{ v: "cercle", l: "El Circol" }].concat(LLOCS_ACTIVITAT_FIXOS).concat([
      { v: "altres", l: state.llocAltresActivitatsNom || "Altres" }
    ]);
    return op.map(function (o) {
      return '<option value="' + o.v + '"' + (val === o.v ? " selected" : "") + '>' + escapeHtml(o.l) + '</option>';
    }).join("");
  }
  function opcionsTarifesHtml(edId, valorActual) {
    var tarifes = tarifesEdicio(edId);
    var html = '<option value="">— Sense preu —</option>';
    html += tarifes.map(function (t) {
      var lbl = t.nom + (t.preu ? " (" + t.preu + ")" : "");
      return '<option value="' + t.id + '"' + (valorActual === t.id ? " selected" : "") + '>' + escapeHtml(lbl) + '</option>';
    }).join("");
    return '<select id="s-tarifa">' + html + '</select>';
  }
  function opcionsTarifesHtmlActivitat(edId, valorActual) {
    var tarifes = tarifesEdicio(edId);
    var html = '<option value="">— Sense preu —</option>';
    html += tarifes.map(function (t) {
      var lbl = t.nom + (t.preu ? " (" + t.preu + ")" : "");
      return '<option value="' + t.id + '"' + (valorActual === t.id ? " selected" : "") + '>' + escapeHtml(lbl) + '</option>';
    }).join("");
    return '<select id="a-tarifa">' + html + '</select>';
  }
  function opcionsTarifesHtmlJuv(edId, valorActual) {
    var tarifes = tarifesEdicio(edId);
    var html = '<option value="">— Sense preu —</option>';
    html += tarifes.map(function (t) {
      var lbl = t.nom + (t.preu ? " (" + t.preu + ")" : "");
      return '<option value="' + t.id + '"' + (valorActual === t.id ? " selected" : "") + '>' + escapeHtml(lbl) + '</option>';
    }).join("");
    return '<select id="j-tarifa">' + html + '</select>';
  }

  function activitatFormHtml(edId) {
    var campsHtml = novaActivitatForm.camps.map(function (cp, i) {
      return '<div class="csx-form-row" style="margin-bottom:6px;">' +
        '<input placeholder="Nom del camp" data-camp-nom="' + i + '" value="' + escapeHtml(cp.nom) + '" style="width:160px;">' +
        '<input placeholder="Valor" data-camp-valor="' + i + '" value="' + escapeHtml(cp.valor) + '" class="csx-grow">' +
        '<button class="csx-link-btn" data-camp-eliminar="' + i + '">eliminar</button>' +
        '</div>';
    }).join("");
    var selectTarifes = edId ? opcionsTarifesHtmlActivitat(edId, novaActivitatForm.tarifaId) : "";
    var fixSel = novaActivitatForm.horaFixada ? " checked" : "";
    var fixCls = novaActivitatForm.horaFixada ? " sel" : "";
    return '<div class="csx-form-row">' +
      '<input id="a-titol" class="csx-grow" placeholder="Títol de l\'activitat" value="' + escapeHtml(novaActivitatForm.titol) + '">' +
      '<input type="date" id="a-dia" value="' + escapeHtml(novaActivitatForm.dia) + '">' +
      '<input type="time" id="a-hora" value="' + escapeHtml(novaActivitatForm.horaInici) + '">' +
      '</div>' +
      '<div class="csx-form-row">' +
      '<div class="csx-dur-group">' +
      '<input type="number" id="a-dur-hores" min="0" placeholder="0" style="width:50px;" value="' + escapeHtml(novaActivitatForm.durHores) + '"><span>h</span>' +
      '<input type="number" id="a-dur-minuts" min="0" max="59" placeholder="0" style="width:50px;" value="' + escapeHtml(novaActivitatForm.durMinuts) + '"><span>min</span>' +
      '</div>' +
      '<select id="a-lloc">' + opcionsLlocActivitatHtml(novaActivitatForm.lloc) + '</select>' +
      selectTarifes +
      '<label class="csx-fix-check' + fixCls + '">' +
      '<input type="checkbox" id="a-fixada"' + fixSel + '> Hora fixa</label>' +
      '<input id="a-contacte" placeholder="Contacte" value="' + escapeHtml(novaActivitatForm.contacte) + '">' +
      '</div>' +
      '<div class="csx-form-row">' +
      '<input id="a-descripcio" class="csx-grow" placeholder="Descripció" value="' + escapeHtml(novaActivitatForm.descripcio) + '">' +
      '</div>' + campsHtml +
      '<div class="csx-form-row">' +
      '<button class="csx-link-btn" id="a-afegir-camp">+ afegir camp personalitzat</button>' +
      '<button class="csx-btn" id="a-crear">Crear activitat</button>' +
      '</div>';
  }

  function campsPersonalitzatsHtml(a, prefix) {
    var camps = a.camps || [];
    var files = camps.map(function (cp, i) {
      return '<div class="csx-form-row" style="margin-bottom:6px;">' +

  function aplicarFiltresPremsa(llista) {
    return llista.filter(function (c) {
      var teTAC = !!c.esTac;
      var teJuv = !!c.esJuvenil;
      var filtreTAC = state.premsaFiltreTAC;
      var filtreJuv = state.premsaFiltreJuvenil;
      if (filtreTAC || filtreJuv) {
        var passa = false;
        if (filtreTAC && teTAC) passa = true;
        if (filtreJuv && teJuv) passa = true;
        if (!passa) return false;
      }
      if (state.premsaFiltrePais) {
        if ((c.pais || "").trim() !== state.premsaFiltrePais) return false;
      }
      return true;
    });
  }
